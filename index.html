/* ── Sparkline ──────────────────────────────────────────────── */
function Sparkline({ data }) {
  const W = 200, H = 32;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const d = data.map((v, i) =>
    `${i === 0 ? 'M' : 'L'}${((i / (data.length - 1)) * W).toFixed(1)},${(H - 2 - ((v - min) / range) * (H - 5)).toFixed(1)}`
  ).join(' ');
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ display: 'block' }}>
      <path d={d} fill="none" stroke="#D25A00" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" />
    </svg>);
}

/* ── Area chart ─────────────────────────────────────────────── */
function StockAreaChart({ data }) {
  const W = 800, H = 230;
  const PAD = { t: 24, r: 24, b: 42, l: 44 };
  const CW = W - PAD.l - PAD.r;
  const CH = H - PAD.t - PAD.b;
  const MIN = 8.5, MAX = 14.5, RNG = MAX - MIN;

  const toX = (i) => PAD.l + (i / (data.length - 1)) * CW;
  const toY = (v) => PAD.t + CH - ((v - MIN) / RNG) * CH;

  const linePts = data.map((v, i) => `${i === 0 ? 'M' : 'L'}${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');
  const areaPts = `${linePts} L${toX(data.length - 1).toFixed(1)},${(PAD.t + CH).toFixed(1)} L${PAD.l},${(PAD.t + CH).toFixed(1)} Z`;

  const peakIdx = data.indexOf(Math.max(...data)); // index 17 → 11.6k
  const px = toX(peakIdx), py = toY(data[peakIdx]);

  const yTicks = [9, 10, 11, 12, 13, 14];
  const xTicks = [0, 4, 9, 14, 19, 24, 29];

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id="sgB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stopColor="#D25A00" stopOpacity="0.18" />
          <stop offset="100%" stopColor="#D25A00" stopOpacity="0.01" />
        </linearGradient>
      </defs>

      {/* Y grid + labels */}
      {yTicks.map((v) => (
        <g key={v}>
          <line x1={PAD.l} y1={toY(v)} x2={W - PAD.r} y2={toY(v)}
            stroke="#E8E0DA" strokeWidth="0.75" strokeDasharray="4,3" />
          <text x={PAD.l - 8} y={toY(v) + 4} textAnchor="end" fontSize="11"
            fill="#7A6060" fontFamily="Inter, sans-serif" fontWeight="500">{v}</text>
        </g>
      ))}

      {/* Area */}
      <path d={areaPts} fill="url(#sgB)" />

      {/* Line */}
      <path d={linePts} fill="none" stroke="#AB1B1A" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />

      {/* Peak vertical */}
      <line x1={px} y1={py + 10} x2={px} y2={PAD.t + CH}
        stroke="#4D2528" strokeWidth="1" strokeDasharray="3,3" opacity="0.35" />

      {/* Peak dot */}
      <circle cx={px} cy={py} r="5.5" fill="#AB1B1A" stroke="#FFFFFF" strokeWidth="2.5" />

      {/* Tooltip */}
      <g transform={`translate(${px - 52},${py - 42})`}>
        <rect width="104" height="28" rx="8" fill="#3A1A1D" />
        <text x="52" y="19" textAnchor="middle" fontSize="12.5" fill="#FFFFFF"
          fontWeight="700" fontFamily="Inter, sans-serif">11.6k unités</text>
      </g>

      {/* X labels */}
      {xTicks.map((i) => (
        <text key={i} x={toX(i)} y={H - 6} textAnchor="middle" fontSize="10.5"
          fill="#7A6060" fontFamily="Inter, sans-serif">
          {i === 29 ? 'Auj.' : `J-${29 - i}`}
        </text>
      ))}
    </svg>);
}

/* ===== App Root ===== */
function AppV7UI() {
  const ROUTE_KEY = 'linge-v7ui-route';
  const VALIDATED_KEY = 'linge-v7ui-validated';
  const [route, setRoute] = React.useState(() => { try { return localStorage.getItem(ROUTE_KEY) || 'accueil'; } catch(e) { return 'accueil'; } });
  const [validatedReceptions, setValidatedReceptions] = React.useState(() => { try { return JSON.parse(localStorage.getItem(VALIDATED_KEY) || '{}'); } catch(e) { return {}; } });
  const [showAnomalie, setShowAnomalie] = React.useState(false);
  const goto = (r) => { setRoute(r); try { localStorage.setItem(ROUTE_KEY, r); } catch(e) {} };
  const onValidateReception = (id, result) => {
    setValidatedReceptions((v) => {
      const next = { ...v, [id]: result };
      try { localStorage.setItem(VALIDATED_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  };
  const onResetReceptions = () => {
    setValidatedReceptions({});
    try { localStorage.removeItem(VALIDATED_KEY); } catch(e) {}
  };
  const pending = typeof pendingReceptionsCount !== 'undefined' ? pendingReceptionsCount(Object.keys(validatedReceptions)) : 0;
  const onAnomalie = () => setShowAnomalie(true);
  const parts = route.split('/');
  let view;
  if (parts[0] === 'commande') {
    view = <CommandeDetailV7 id={parts[1]} goto={goto} pendingReceptions={pending} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'reception' && parts[1]) {
    view = <ReceptionDetailV7 id={parts[1]} goto={goto} pendingReceptions={pending} validatedReceptions={validatedReceptions} onValidateReception={onValidateReception} initialDiff={parts[2]==='diff'} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'nouvelle-commande') {
    view = <NouvelleCommandeV7 goto={goto} pendingReceptions={pending} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'parametrage') {
    const sub = parts[1] || 'chambres';
    view = <ParametrageV8 goto={goto} pendingReceptions={pending} sub={sub} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'linge') {
    const tab = parts[1] || 'commandes';
    view = <LingeV7 goto={goto} tab={tab} pendingReceptions={pending} validatedReceptions={validatedReceptions} onValidateReception={onValidateReception} onResetReceptions={onResetReceptions} onAnomalie={onAnomalie} />;
  } else {
    view = <AccueilDashboard goto={goto} pendingReceptions={pending} onAnomalie={onAnomalie} />;
  }
  return (<>{view}{showAnomalie && <AnomalieModal onClose={() => setShowAnomalie(false)} />}</>);
}
