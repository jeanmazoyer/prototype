  <script>
    (function() {
      var PWD_HASH = 'aG9zbG93MjAyNg==';
      var AUTH_KEY = 'hoslow-auth-v1';
      function check() {
        if (localStorage.getItem(AUTH_KEY) === PWD_HASH) {
          var g = document.getElementById('hoslow-gate');
          if (g) g.remove();
        }
      }
      check();
      window.hoslowCheck = function() {
        var val = document.getElementById('hoslow-pwd').value;
        if (btoa(val) === PWD_HASH) {
          localStorage.setItem(AUTH_KEY, PWD_HASH);
          document.getElementById('hoslow-gate').remove();
        } else {
          document.getElementById('hoslow-err').style.display = 'block';
          document.getElementById('hoslow-pwd').style.borderColor = '#AB1B1A';
          setTimeout(function() { document.getElementById('hoslow-pwd').focus(); }, 10);
        }
      };
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.getElementById('hoslow-gate')) hoslowCheck();
      });
    })();
  </script>

/* ---------- Button ---------- */
function Button({ variant = 'primary', size = 'md', children, icon, iconRight, block, style, ...rest }) {
  const sizes = {
    sm: { padding: '8px 12px', fontSize: 13, radius: 8 },
    md: { padding: '11px 18px', fontSize: 14, radius: 10 },
    lg: { padding: '14px 22px', fontSize: 15, radius: 12 },
    xl: { padding: '20px 24px', fontSize: 17, radius: 14 }, // mobile field
  };
  const s = sizes[size];
  const variants = {
    cta:      { background: '#E06417', color: '#fff', border: '1px solid #E06417' },
    primary:  { background: '#502325', color: '#fff', border: '1px solid #502325' },
    ghost:    { background: '#fff',    color: '#502325', border: '1px solid #E8E0DA' },
    tinted:   { background: '#FFDDC0', color: '#502325', border: '1px solid #EBC9A9' },
    danger:   { background: '#B92D23', color: '#fff', border: '1px solid #B92D23' },
    text:     { background: 'transparent', color: '#502325', border: '1px solid transparent' },
    dark:     { background: '#3D1B1D', color: '#FFDDC0', border: '1px solid #3D1B1D' },
  };
  return (
    <button
      style={{
        fontFamily: 'inherit', fontWeight: 500, lineHeight: 1,
        padding: s.padding, fontSize: s.fontSize, borderRadius: s.radius,
        cursor: 'pointer', display: block ? 'flex' : 'inline-flex',
        width: block ? '100%' : undefined,
        alignItems: 'center', justifyContent: 'center', gap: 8,
        transition: 'all 160ms cubic-bezier(.2,.7,.2,1)',
        ...variants[variant], ...style,
      }}
      {...rest}
    >
      {icon}{children}{iconRight}
    </button>
  );
}

/* ---------- Badge ---------- */
function Badge({ tone = 'neutral', dot, children, size = 'md', style }) {
  const tones = {
    neutral: { bg: '#EFE9E4', fg: '#502325', dot: '#8F7F7B' },
    cream:   { bg: '#FFDDC0', fg: '#502325', dot: '#752829' },
    peach:   { bg: '#F2B07D', fg: '#502325', dot: '#752829' },
    danger:  { bg: '#FAD5C9', fg: '#B92D23', dot: '#B92D23' },
    warning: { bg: '#FCE4C7', fg: '#A14B0D', dot: '#E06417' },
    success: { bg: '#E5EDD8', fg: '#3F5A29', dot: '#5A7A3E' },
    burgundy:{ bg: '#502325', fg: '#FFDDC0', dot: '#FFDDC0' },
    ghost:   { bg: 'transparent', fg: '#502325', dot: '#502325', border: '1px solid #E8E0DA' },
  };
  const t = tones[tone];
  const small = size === 'sm';
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      fontSize: small ? 10 : 11, fontWeight: 600,
      padding: small ? '2px 8px' : '4px 10px',
      borderRadius: 999, background: t.bg, color: t.fg, lineHeight: 1.4,
      letterSpacing: 0.3, border: t.border, whiteSpace: 'nowrap',
      ...style,
    }}>
      {dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: t.dot }} />}
      {children}
    </span>
  );
}

/* ---------- Bottom sheet (mobile) ---------- */
function Sheet({ open, onClose, title, children, height = 'auto' }) {
  if (!open) return null;
  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 50, pointerEvents: open ? 'auto' : 'none' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(80,35,37,0.40)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)' }} />
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0,
        background: '#fff', borderTopLeftRadius: 20, borderTopRightRadius: 20,
        padding: '12px 16px 24px', boxShadow: '0 -8px 24px rgba(80,35,37,0.18)',
        maxHeight: '85%', overflowY: 'auto',
        animation: 'sheetUp 200ms cubic-bezier(.2,.7,.2,1)',
      }}>
        <div style={{ width: 40, height: 4, borderRadius: 999, background: '#E8E0DA', margin: '4px auto 14px' }} />
        {title && <div style={{ fontWeight: 700, fontSize: 18, color: '#502325', marginBottom: 14 }}>{title}</div>}
        {children}
      </div>
    </div>
  );
}

/* ---------- Toast (auto-dismiss) ---------- */
function Toast({ message, tone = 'success', onClose }) {
  useEffectP(() => {
    if (!message) return;
    const t = setTimeout(() => onClose && onClose(), 2400);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  const skin = tone === 'success'
    ? { bg: '#502325', fg: '#fff', dot: '#5A7A3E' }
    : tone === 'danger'
    ? { bg: '#B92D23', fg: '#fff', dot: '#fff' }
    : { bg: '#3D1B1D', fg: '#FFDDC0', dot: '#F2B07D' };
  return (
    <div style={{
      position: 'absolute', left: 16, right: 16, bottom: 24, zIndex: 100,
      background: skin.bg, color: skin.fg, padding: '14px 16px', borderRadius: 12,
      display: 'flex', alignItems: 'center', gap: 10, fontWeight: 500, fontSize: 14,
      boxShadow: '0 8px 24px rgba(80,35,37,0.30)',
      animation: 'toastUp 200ms cubic-bezier(.2,.7,.2,1)',
    }}>
      <Dot color={skin.dot} size={8} />
      {message}
    </div>
  );
}

/* ---------- Responsive: largeur de fenêtre observée ----------
   Paliers (basés sur la largeur du viewport, la sidebar restant fixe le plus longtemps possible) :
     · > 1180  → 2 colonnes (contenu principal + colonne droite)
     · ≤ 1180  → colonne droite repliée SOUS le contenu (sidebar toujours fixe)
     · ≤ 880   → dernier recours : sidebar réduite en rail d'icônes + tooltips */
const HOS_BP = { stack: 1180, compact: 880 };
function useViewportWidth() {
  const [w, setW] = React.useState(() => (typeof window !== 'undefined' ? window.innerWidth : 1440));
  React.useEffect(() => {
    let raf = 0;
    const onResize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setW(window.innerWidth)); };
    window.addEventListener('resize', onResize);
    return () => { window.removeEventListener('resize', onResize); cancelAnimationFrame(raf); };
  }, []);
  return w;
}

Object.assign(window, { Icon, Button, Badge, Card, SectionTitle, Stepper, Dot, Progress, Toggle, Sheet, Toast, useViewportWidth, HOS_BP });

const LINGE_KEY_V8 = 'hoslow-v8-linges-5';
function normLinge(l) {
  const depts = Array.isArray(l.depts) && l.depts.length ? [...l.depts] : ['hebergement'];
  let tampons = (l.tampons && typeof l.tampons === 'object') ? { ...l.tampons } : {};
  depts.forEach((d) => { if (tampons[d] == null) tampons[d] = (typeof l.tampon === 'number' ? l.tampon : 100); });
  const category = l.category || 'serviette';
  return { sku: l.sku, name: l.name, supplier: l.supplier, depts, tampons, category };
}
function loadLinges() {
  try { const raw = JSON.parse(localStorage.getItem(LINGE_KEY_V8)); if (Array.isArray(raw) && raw.length) return raw.map(normLinge); } catch (e) {}
  return LINGE_SEED_V8.map(normLinge);
}
let LINGES_V8 = loadLinges();
function getLinges() { return LINGES_V8; }
function saveLinges(next) { LINGES_V8 = next; try { localStorage.setItem(LINGE_KEY_V8, JSON.stringify(next)); } catch (e) {} }
function lingeOf(sku) { return LINGES_V8.find((l) => l.sku === sku) || null; }
function deptsOfSku(sku) { const l = lingeOf(sku); return l ? l.depts : ['hebergement']; }

function lingeDeptEntries() {
  const out = [];
  LINGES_V8.forEach((l) => l.depts.forEach((d) => out.push({ sku: l.sku, dept: d, linge: l })));

}

function groupSkusByDept(skus) {
  const map = {};
  (typeof DEPARTMENTS_V7 !== 'undefined' ? DEPARTMENTS_V7 : []).forEach((d) => { map[d.id] = []; });
  skus.forEach((sku) => deptsOfSku(sku).forEach((d) => { (map[d] = map[d] || []).push(sku); }));

  { id: 'wr-2', threshold: 31, coef: 1.12 },
];

const EVENTS_KEY_V8 = 'hoslow-v8-events';
const WEATHER_KEY_V8 = 'hoslow-v8-weather-rules';
function loadStore(key, seed) {
  try { const raw = JSON.parse(localStorage.getItem(key)); if (Array.isArray(raw)) return raw; } catch (e) {}
  return seed.map((x) => ({ ...x }));
}
let EVENTS_V8 = loadStore(EVENTS_KEY_V8, EVENTS_SEED_V8);
let WEATHER_RULES_V8 = loadStore(WEATHER_KEY_V8, WEATHER_SEED_V8);
function getEvents() { return EVENTS_V8; }
function saveEvents(next) { EVENTS_V8 = next; try { localStorage.setItem(EVENTS_KEY_V8, JSON.stringify(next)); } catch (e) {} }
function getWeatherRules() { return WEATHER_RULES_V8; }
function saveWeatherRules(next) { WEATHER_RULES_V8 = next; try { localStorage.setItem(WEATHER_KEY_V8, JSON.stringify(next)); } catch (e) {} }

/* Température de pointe sur l'horizon (démo : max météo 5 jours) */
function peakTempV8() {
  if (typeof WEATHER_V4 === 'undefined') return 31;
  return Math.max(...WEATHER_V4.map((d) => d.temp));
}
/* Coefficient météo applicable : la règle au seuil le plus élevé atteint */
function meteoCoefFor(temp) {
  const rules = getWeatherRules().slice().sort((a, b) => b.threshold - a.threshold);
  const hit = rules.find((r) => temp >= r.threshold);
  return hit ? { coef: hit.coef, threshold: hit.threshold } : { coef: 1, threshold: null };
}
/* Événement actif sur la période */
function activeEventV8() {
  return getEvents().find((e) => e.active) || null;
}

/* ============================================================
   SUGGESTION — calcul détaillé pour le tooltip
   Modèle : les coefficients (météo, évènement) agissent sur le
   TAUX D'OCCUPATION, pas sur les quantités directement.
   1. occupation réservations (base)
   2. × coef météo  → relève le taux
   3. × coef évènement → relève le taux
   = taux d'occupation ajusté (plafonné à 100 %)
   4. ce taux ajusté détermine l'utilisation prédite (chambres × dotation)
   5. + marge fournisseur (sécurité sur la quantité)
   suggéré = tampon − stock + utilisation ajustée  (reconstitue le tampon)
   ============================================================ */
function suggestionBreakdownV8(sku, supplierId) {
  const row = (typeof STOCK_V7 !== 'undefined') ? STOCK_V7.find((s) => s.sku === sku) : null;
  const stock = row ? row.niveau : 0;
  const tampon = row ? row.tampon : 0;
  const occ = (typeof occupancyTotals !== 'undefined') ? occupancyTotals() : { rate: 0, occupied: 0, totalRooms: 0 };
  const occBase = occ.rate || 0;

  const temp = peakTempV8();
  const m = meteoCoefFor(temp);
  const ev = activeEventV8();
  const eventCoef = ev ? ev.coef : 1;
  const sup = (typeof supplierOf !== 'undefined') ? supplierOf(supplierId) : null;
  const errorRate = sup ? (sup.errorRate || 0) : 0;

  /* 1→3 : les coefficients relèvent le taux d'occupation */
  const occRaw = occBase * m.coef * eventCoef;
  const occAdjusted = Math.min(100, Math.round(occRaw));
  const occupiedAdjusted = Math.round(occ.totalRooms * occAdjusted / 100);

  /* 4 : utilisation prédite, dérivée du taux d'occupation */
  let predictedBase = (typeof consumptionForSku !== 'undefined') ? consumptionForSku(sku) : 0; // à l'occupation de base
  let predictedEstimated = false;
  if (!predictedBase) { predictedBase = Math.round(tampon * 0.18); predictedEstimated = true; } // linge non rattaché à une dotation chambre
  const ratio = occBase > 0 ? occAdjusted / occBase : 1;
  const predicted = Math.round(predictedBase * ratio); // utilisation prédite au taux ajusté

  /* 5 : marge fournisseur sur la quantité */
  const adjustedUsage = Math.round(predicted * (1 + errorRate / 100));

  const projected = stock - predicted;                  // stock projeté après usage prédit
  const margeTampon = projected - tampon;               // + au-dessus / − en-dessous du tampon
  const suggested = Math.max(0, Math.round(tampon - stock + adjustedUsage));

  return {
    sku, stock, tampon,
    occRate: occBase, occupied: occ.occupied, totalRooms: occ.totalRooms,
    occAdjusted, occupiedAdjusted,
    predicted, predictedBase, predictedEstimated, temp,
    meteoCoef: m.coef, meteoThreshold: m.threshold,
    eventLabel: ev ? ev.name : null, eventCoef,
    supplierName: sup ? sup.name : (supplierId || '—'), errorRate,
    adjustedUsage, projected, margeTampon, suggested,
  };
}

/* Total suggéré d'une commande (cohérent avec le détail) */
function commandeSuggestedTotalV8(commande) {
  if (!commande || !commande.lines || !commande.lines.length) return null;
  return commande.lines.reduce((s, l) => s + suggestionBreakdownV8(l.sku, commande.supplier).suggested, 0);
}

function CommandeDetailV7({ id, goto, pendingReceptions, onAnomalie }) {

  if (!commande) {
    return (
      <ShellV7 active="linge/commandes" onNavigate={goto} pendingReceptions={pendingReceptions} onAnomalie={onAnomalie} title="Commande introuvable">
        <Cta7 onClick={() => goto('linge/commandes')}>Retour</Cta7>
      </ShellV7>);
  }
  const sup = supplierOf(commande.supplier);
  const [adjust, setAdjust] = useStCmd({});
  const [extras, setExtras] = useStCmd({});
  const [removed, setRemoved] = useStCmd({});
  const [toast, setToast] = useStCmd(null);
  const totals = occupancyTotals();
  const vwDetail = useViewportWidth();
  const detailStacked = vwDetail <= HOS_BP.stack;
  const fc = typeof WEATHER_V4 !== 'undefined' && (WEATHER_V4.find((d) => d.event) || WEATHER_V4[0]) || { temp: 30, icon: 'sun', condition: 'Ensoleillé', impact: '' };

  const lines = commande.lines.filter((l) => !removed[l.sku]).map((l) => {
    const bd = suggestionBreakdownV8(l.sku, commande.supplier);
    const finalQty = Math.max(0, Math.round(bd.suggested * (1 + (adjust[l.sku] || 0) / 100)));
    return { ...l, bd, suggested: bd.suggested, finalQty };
  });
  const extrasTotal = Object.values(extras).reduce((a, b) => a + (Number(b) || 0), 0);
  const totalFinal = lines.reduce((a, b) => a + b.finalQty, 0) + extrasTotal;
  const totalSuggested = lines.reduce((a, b) => a + b.suggested, 0);
  const totalArticles = lines.length + Object.keys(extras).length;
  const setPct = (sku, p) => setAdjust((a) => ({ ...a, [sku]: Math.max(-50, Math.min(50, p)) }));
  const removeLine = (sku) => {setRemoved((r) => ({ ...r, [sku]: true }));setToast(`${skuOfV7(sku).label} retiré de la commande`);};
  const setExtraQty = (sku, q) => setExtras((e) => ({ ...e, [sku]: Math.max(0, q) }));
  const removeExtra = (sku) => setExtras((e) => {const n = { ...e };delete n[sku];return n;});
  const addExtra = (sku) => setExtras((e) => e[sku] != null ? e : { ...e, [sku]: 10 });
  const suggestedSkus = new Set(lines.map((l) => l.sku));
  const availableForAdd = (typeof getLinges !== 'undefined' ? getLinges() : []).filter((l) => !suggestedSkus.has(l.sku) && extras[l.sku] == null);
  const isValidated = commande.status === 'validee';

  return (

        <span style={{ fontSize: 11, color: '#7A6060' }}></span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: vwDetail <= 760 ? 'repeat(auto-fit, minmax(160px, 1fr))' : 'repeat(3, 1fr)', gap: 14 }}>
        <IndicatorCard7 kicker="Occupation attendue" icon="bed">
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ fontWeight: 900, fontSize: 30, letterSpacing: '-0.02em', color: '#4D2528', lineHeight: 1 }}>{totals.rate}%</span>
            <span style={{ fontSize: 13, color: '#5E4040' }}>{totals.occupied}/{totals.totalRooms} ch.</span>
          </div>
          <div style={{ fontSize: 12, color: '#5E4040', marginTop: 4 }}>Réservations · base du calcul des suggestions</div>

  const total = Object.values(qtys).reduce((a, b) => a + (Number(b) || 0), 0);
  const totalSkus = Object.values(qtys).filter((v) => Number(v) > 0).length;
  const set = (id, v) => setQtys((q) => ({ ...q, [id]: Math.max(0, v) }));
  const submit = () => {setToast(`Commande envoyée · ${total} pièces`);setTimeout(() => goto('linge/commandes'), 1400);};

  return (

const MINW_RCP = 560;

function ReceptionDetailV7({ id, goto, pendingReceptions, validatedReceptions = {}, onValidateReception, initialDiff = false, onAnomalie }) {
  const reception = receptionOf(id);
  if (!reception) {
    return (
      <ShellV7 active="linge/commandes" onNavigate={goto} pendingReceptions={pendingReceptions} onAnomalie={onAnomalie} title="Réception introuvable">
        <Cta7 onClick={() => goto('linge/reception')}>Retour</Cta7>
      </ShellV7>);
  }
  const sup = supplierOf(reception.supplier);
  const contact = typeof SUPPLIER_CONTACTS_V6 !== 'undefined' ? SUPPLIER_CONTACTS_V6[reception.supplier] : null;
  const alreadyValidated = !!validatedReceptions[reception.id] || reception.status !== 'a-verifier';
  const saved = validatedReceptions[reception.id];

  const [diffMode, setDiffMode] = useStRcp(initialDiff);
  const [conforme, setConforme] = useStRcp(false);
  const [openAnomalyLine, setOpenAnomalyLine] = useStRcp(null);
  const [toast, setToast] = useStRcp(null);

  const [actual, setActual] = useStRcp(() => {
    const m = {};
    if (saved && saved.snapshot) {
      saved.snapshot.lines.forEach((x) => {m[x.sku] = x.got;});
      return m;
    }
    reception.lines.forEach((l) => {m[l.sku] = l.received != null ? l.received : l.bl != null ? l.bl : l.ordered;});
    return m;
  });
  /* anomalies: sku -> { qty, photos:[{id,url}] } */
  const [anomalies, setAnomalies] = useStRcp(() => {
    const m = {};
    if (saved && saved.snapshot) {
      saved.snapshot.lines.forEach((x) => {if (x.anomalyQty > 0) m[x.sku] = { qty: x.anomalyQty, photos: x.photos || [], comment: x.comment || '' };});
      return m;
    }
    const seed = typeof ANOMALIES_V6 !== 'undefined' && ANOMALIES_V6[reception.id] ? ANOMALIES_V6[reception.id] : {};
    Object.keys(seed).forEach((k) => {m[k] = { qty: seed[k], photos: [{ id: 'seed', url: null }] };});
    return m;
  });

  const getGot = (sku) => actual[sku] ?? 0;
  const totalOrdered = reception.lines.reduce((s, l) => s + l.ordered, 0);
  const totalBl = reception.lines.reduce((s, l) => s + (l.bl != null ? l.bl : 0), 0);
  const hasBl = reception.lines.some((l) => l.bl != null);
  const hasReceived = reception.lines.some((l) => l.received != null) || diffMode || conforme || alreadyValidated;
  const totalActual = reception.lines.reduce((s, l) => s + getGot(l.sku), 0);
  const totalAnomalies = conforme ? 0 : reception.lines.reduce((s, l) => s + (anomalies[l.sku]?.qty || 0), 0);
  const totalEntreStock = totalActual - totalAnomalies;
  const totalDiff = totalActual - totalOrdered;
  const hasDiff = reception.lines.some((l) => getGot(l.sku) !== l.ordered);

  const setQty = (sku, v) => setActual((a) => ({ ...a, [sku]: Math.max(0, parseInt(v, 10) || 0) }));
  const setAnomaly = (sku, payload) => setAnomalies((a) => {
    if (!payload || payload.qty === 0) {const n = { ...a };delete n[sku];return n;}
    return { ...a, [sku]: payload };
  });

  /* Tout est conforme : réellement reçu = BL = entré stock.
     On bascule l'écran en état "conforme" (le récap se met à jour) puis on valide. */
  const buildSnapshot = (forceConforme) => ({
    lines: reception.lines.map((l) => ({
      sku: l.sku,
      got: getGot(l.sku),
      anomalyQty: forceConforme ? 0 : anomalies[l.sku]?.qty || 0,
      photos: forceConforme ? [] : anomalies[l.sku]?.photos || [],
      comment: forceConforme ? '' : anomalies[l.sku]?.comment || ''
    }))
  });

  const validateConforme = () => {
    setConforme(true);
    setOpenAnomalyLine(null);
    setToast('Réception validée comme conforme · ' + totalActual + ' pièces entrées en stock');
    setTimeout(() => {
      onValidateReception && onValidateReception(reception.id, { result: 'conforme', entreStock: totalActual, anomalies: 0, when: 'à l\'instant', snapshot: buildSnapshot(true) });
      goto('linge/reception');
    }, 1400);
  };

  const submit = () => {
    const result = hasDiff || totalAnomalies > 0 ? 'differentiel' : 'conforme';
    setToast(hasDiff ?
    `Différentiel enregistré · ${Math.abs(totalDiff)} pièce${Math.abs(totalDiff) > 1 ? 's' : ''} ${totalDiff < 0 ? 'manquante(s)' : 'en plus'}` :
    'Réception validée comme conforme');
    setTimeout(() => {
      onValidateReception && onValidateReception(reception.id, { result, entreStock: totalEntreStock, anomalies: totalAnomalies, when: 'à l\'instant', snapshot: buildSnapshot(false) });
      goto('linge/reception');
    }, 1400);
  };

  return (
    <ShellV7
      active="linge/commandes" onNavigate={goto} pendingReceptions={pendingReceptions} onAnomalie={onAnomalie}
      kicker={USER_V4.hotel}
      title={`Réception · ${reception.deliveryDate}`}
      sub={`${sup?.name} · ${reception.refCmd}`}
      right={<Cta7 variant="ghost" icon={<Icon name="chevronL" size={16} />} onClick={() => goto('linge/reception')}>Retour</Cta7>}>

      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 310px', gap: 20, alignItems: 'flex-start' }}>
        {/* Tableau articles */}
        <Card7 padded={false} style={{ overflowX: 'auto' }}>
          <div style={{ padding: '16px 22px', borderBottom: '1px solid #F0F0F0' }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040' }}>{diffMode ? 'Saisie du différentiel' : 'Détail de la commande reçue'}</div>
            <div style={{ fontWeight: 700, fontSize: 16, color: '#4D2528', marginTop: 2 }}>{reception.lines.length} articles · {totalOrdered} pièces commandées</div>
          </div>
          <div style={{ padding: '10px 22px', borderBottom: '1px solid #F5F5F5', display: 'grid', gridTemplateColumns: COL_RCP, gap: 10, fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040', minWidth: MINW_RCP }}>
            <span>Article</span>
            <span style={{ textAlign: 'right' }}>Commandé</span>
            <span style={{ textAlign: 'right' }}>BL</span>
            <span style={{ textAlign: 'right' }}>Réel. reçu</span>
            <span style={{ textAlign: 'right' }}>Anomalie</span>
            <span style={{ textAlign: 'right' }}>Entré stock</span>
          </div>
          {(() => {
            const groups = {};
            reception.lines.forEach((l) => {
              const d = (typeof deptsOfSku !== 'undefined' ? deptsOfSku(l.sku)[0] : 'hebergement') || 'hebergement';
              (groups[d] = groups[d] || []).push(l);
            });
            const order = (typeof DEPARTMENTS_V7 !== 'undefined' ? DEPARTMENTS_V7 : []).filter((d) => groups[d.id] && groups[d.id].length);
            return order.map((d, gi) =>
            <div key={d.id}>
                <div style={{ padding: '10px 22px', background: '#FAFAFA', borderTop: gi ? '1px solid #F0F0F0' : 0, borderBottom: '1px solid #F0F0F0', display: 'flex', alignItems: 'center', gap: 9, minWidth: MINW_RCP }}>
                  <DeptIcon7 id={d.id} size={14} color="#1A1A1A" />
                  <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.4, textTransform: 'uppercase', color: '#4D2528' }}>{d.label}</span>
                  <span style={{ fontSize: 11, color: '#7A6060' }}>{groups[d.id].length} article{groups[d.id].length > 1 ? 's' : ''}</span>
                </div>
                {groups[d.id].map((l) =>
              <ReceptionLine7 key={l.sku} line={l} got={getGot(l.sku)} anomaly={conforme ? null : anomalies[l.sku] || null}
              isOpen={openAnomalyLine === l.sku} onToggle={(sku) => setOpenAnomalyLine(sku)}
              onConfirm={setAnomaly} diffMode={diffMode} conforme={conforme} locked={alreadyValidated} onSetQty={setQty} last={false} />)}
              </div>);
          })()}
        </Card7>

        {/* Colonne droite */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Card7>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040' }}>Récapitulatif</div>
            <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
              <RecapRowR7 label="Commandé" value={totalOrdered} />
              <RecapRowR7 label="Bon de livraison" value={hasBl ? totalBl : null} muted={!hasBl} diff={hasBl ? totalBl - totalOrdered : null} />
              <RecapRowR7 label={diffMode ? 'Déclaré reçu' : 'Réellement reçu'} value={hasReceived ? totalActual : null} muted={!hasReceived} diff={hasReceived && hasBl ? totalActual - totalBl : null} />
              {totalAnomalies > 0 &&
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 10px', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 8 }}>
                  <span style={{ fontSize: 12, color: '#92400E', display: 'inline-flex', alignItems: 'center', gap: 6 }}><Icon name="alert" size={13} color="#D97706" />Anomalies déclarées</span>
                  <span style={{ fontWeight: 800, fontSize: 16, color: '#D97706' }}>− {totalAnomalies}</span>
                </div>}
              <div style={{ borderTop: '1px solid #F0F0F0', paddingTop: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: '#4D2528' }}>Entré au stock</span>
                <span style={{ fontWeight: 900, fontSize: 28, letterSpacing: '-0.02em', color: totalAnomalies > 0 ? '#D97706' : hasReceived ? '#4D2528' : '#C8C8C8' }}>{hasReceived ? totalEntreStock : '—'}</span>
              </div>
            </div>

            {alreadyValidated ?
            (() => {
              const res = validatedReceptions[reception.id]?.result || reception.status;
              const isDiff = res === 'differentiel';
              return (
                <div style={{ marginTop: 16, background: '#F0F0F0', borderRadius: 10, padding: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
                      <Icon name="check" size={18} color="#1A1A1A" />
                      <div style={{ fontSize: 12, color: '#4D2528', lineHeight: 1.5 }}>Réception déjà traitée — <strong>{isDiff ? 'différentiel enregistré' : 'validée comme conforme'}</strong>. Aucune action possible.</div>
                    </div>);
            })() :
            <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {!diffMode ?
              <>
                        <button onClick={() => setDiffMode(true)} style={btnDark7}><Icon name="alert" size={16} color="#FFFFFF" />Indiquer un différentiel</button>
                        <button onClick={validateConforme} style={btnGhost7}><Icon name="check" size={14} color="#0A0A0A" />Tout est conforme</button>
                      </> :
              <>
                        <button onClick={submit} style={btnDark7}><Icon name="check" size={16} color="#FFFFFF" />Valider la réception</button>
                        <button onClick={() => goto('linge/reception')} style={{ padding: '10px 16px', borderRadius: 10, background: 'transparent', border: 0, color: '#5E4040', fontFamily: 'inherit', fontSize: 13, cursor: 'pointer' }}>Annuler</button>
                      </>}
                </div>}
          </Card7>

          {/* Fournisseur + contact */}
          <Card7>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040', marginBottom: 8 }}>Fournisseur</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: '#F0F0F0', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name="truck" size={18} color="#1A1A1A" /></div>
              <div><div style={{ fontWeight: 700, fontSize: 15, color: '#4D2528' }}>{sup?.name}</div><div style={{ fontSize: 12, color: '#5E4040' }}>{sup?.api ? 'API directe' : 'Email auto'}</div></div>
            </div>
            {contact &&
            <>
                <div style={{ borderTop: '1px solid #F0F0F0', margin: '12px 0' }} />
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040', marginBottom: 8 }}>Chargé d'affaire</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                  <div style={{ width: 32, height: 32, borderRadius: '50%', background: '#4D2528', color: '#FFFFFF', display: 'grid', placeItems: 'center', fontWeight: 800, fontSize: 11 }}>{contact.firstName[0]}{contact.lastName[0]}</div>
                  <div style={{ fontWeight: 600, fontSize: 14, color: '#4D2528' }}>{contact.firstName} {contact.lastName}</div>
                </div>
                <a href={`mailto:${contact.email}`} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', background: '#F5F5F5', borderRadius: 9, textDecoration: 'none' }}>
                  <Icon name="mail" size={14} color="#1A1A1A" />
                  <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 10, color: '#5E4040', fontWeight: 600 }}>Email</div><div style={{ fontSize: 11, fontWeight: 600, color: '#4D2528', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{contact.email}</div></div>
                </a>
              </>}
          </Card7>
        </div>
      </div>

      <FixedToast7 message={toast} onClose={() => setToast(null)} />
    </ShellV7>);
}

const btnDark7 = { padding: '14px 20px', borderRadius: 12, background: '#4D2528', color: '#FFFFFF', border: 0, fontFamily: 'inherit', fontSize: 15, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 };
const btnGhost7 = { padding: '12px 20px', borderRadius: 10, background: '#FFFFFF', color: '#4D2528', border: '1px solid #D0D0D0', fontFamily: 'inherit', fontSize: 14, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 };

/* ---------- Ligne réception + anomalie avec PHOTO obligatoire ---------- */
function ReceptionLine7({ line, got, anomaly, isOpen, onToggle, onConfirm, diffMode, conforme, locked, onSetQty, last }) {
  const sku = skuOfV7(line.sku);
  const fileRef = useRefRcp(null);
  const [qty, setQty] = useStRcp(anomaly?.qty || 0);
  const [photos, setPhotos] = useStRcp(anomaly?.photos || []);
  const [comment, setComment] = useStRcp(anomaly?.comment || '');

  useEfRcp(() => {if (isOpen) {setQty(anomaly?.qty || 1);setPhotos(anomaly?.photos || []);setComment(anomaly?.comment || '');}}, [isOpen]);

  const blQty = line.bl;
  const diffBlVsOrd = blQty != null ? blQty - line.ordered : 0;
  const entreStock = got - (anomaly?.qty || 0);
  const hasGot = line.received != null || diffMode || conforme || locked;
  const canConfirm = qty > 0 && photos.length > 0;

  const addPhotos = (files) => {
    const valid = Array.from(files).filter((f) => f.type.startsWith('image/')).map((f) => ({ id: Math.random().toString(36).slice(2), url: URL.createObjectURL(f) }));
    setPhotos((p) => [...p, ...valid]);
  };

  return (
    <div style={{ borderBottom: last ? 0 : '1px solid #F5F5F5' }}>
      <div style={{ padding: '13px 22px', display: 'grid', gridTemplateColumns: COL_RCP, gap: 10, alignItems: 'center', minWidth: MINW_RCP }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: '#EAEAEA', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name="package" size={15} color="#1A1A1A" /></div>
          <div><div style={{ fontWeight: 600, fontSize: 13, color: '#4D2528' }}>{sku.label}</div><div style={{ fontSize: 10, color: '#7A6060', marginTop: 1 }}>{line.sku.toUpperCase()}</div></div>
        </div>
        <div style={{ textAlign: 'right', fontWeight: 700, fontSize: 16, color: '#4D2528', fontVariantNumeric: 'tabular-nums' }}>{line.ordered}</div>
        <div style={{ textAlign: 'right' }}>
          {blQty != null ?
          <span style={{ fontWeight: 700, fontSize: 16, color: '#4D2528', display: 'inline-flex', alignItems: 'center', gap: 4 }}>{diffBlVsOrd !== 0 && <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#4D2528' }} />}{blQty}</span> :
          <span style={{ fontSize: 14, color: '#C8C8C8' }}>—</span>}
        </div>
        <div style={{ textAlign: 'right' }}>
          {diffMode ?
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, justifyContent: 'flex-end' }}>
                <button onClick={() => onSetQty(line.sku, got - 1)} style={microBtn7}>−</button>
                <input type="number" value={got} onChange={(e) => onSetQty(line.sku, e.target.value)} style={{ width: 44, padding: '3px 4px', borderRadius: 6, border: '1px solid #D0D0D0', fontFamily: 'inherit', fontSize: 13, fontWeight: 700, color: '#4D2528', textAlign: 'center' }} />
                <button onClick={() => onSetQty(line.sku, got + 1)} style={microBtn7}>+</button>
              </div> :
          line.received != null ?
          <span style={{ fontWeight: 700, fontSize: 16, color: '#4D2528' }}>{line.received}</span> :
          conforme || locked ?
          <span style={{ fontWeight: 700, fontSize: 16, color: '#4D2528' }}>{got}</span> :
          <span style={{ fontSize: 12, color: '#7A6060', fontStyle: 'italic' }}>À vérifier</span>}
        </div>
        <div style={{ textAlign: 'right' }}>
          {conforme ?
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 999, fontSize: 11, fontWeight: 600, background: '#F0F0F0', color: '#5E4040', border: '1px solid #E5E5E5' }}><Icon name="check" size={10} color="#6B6B6B" />Aucune</span> :
          locked ?
          (anomaly?.qty || 0) > 0 ?
          <button onClick={() => onToggle(isOpen ? null : line.sku)} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 999, fontFamily: 'inherit', fontSize: 12, fontWeight: 700, background: isOpen ? '#4D2528' : '#FEF3C7', color: isOpen ? '#FFFFFF' : '#92400E', border: isOpen ? '1px solid #1A1A1A' : '1px solid #FDE68A', cursor: 'pointer' }}><Icon name="alert" size={11} color={isOpen ? '#FFFFFF' : '#D97706'} />{anomaly.qty}</button> :
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 999, fontSize: 11, fontWeight: 600, background: '#F0F0F0', color: '#5E4040', border: '1px solid #E5E5E5' }}><Icon name="check" size={10} color="#6B6B6B" />Aucune</span> :
          (anomaly?.qty || 0) > 0 ?
          <button onClick={() => onToggle(isOpen ? null : line.sku)} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 999, fontFamily: 'inherit', fontSize: 12, fontWeight: 700, background: isOpen ? '#4D2528' : '#FEF3C7', color: isOpen ? '#FFFFFF' : '#92400E', border: isOpen ? '1px solid #1A1A1A' : '1px solid #FDE68A', cursor: 'pointer' }}>
                <Icon name="alert" size={11} color={isOpen ? '#FFFFFF' : '#D97706'} />{anomaly.qty}
              </button> :
          <button onClick={() => onToggle(isOpen ? null : line.sku)} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 999, fontFamily: 'inherit', fontSize: 11, fontWeight: 600, background: isOpen ? '#F5F5F5' : '#FFFFFF', color: '#5E4040', border: '1px solid #D4D4D4', cursor: 'pointer' }}>
                <Icon name="alert" size={10} color="#9A9A9A" />Signaler
              </button>}
        </div>
        <div style={{ textAlign: 'right' }}>
          {hasGot ? <span style={{ fontWeight: 800, fontSize: 16, color: (anomaly?.qty || 0) > 0 ? '#D97706' : '#4D2528' }}>{entreStock}</span> : <span style={{ fontSize: 14, color: '#C8C8C8' }}>—</span>}
        </div>
      </div>

      {/* Panneau anomalie — lecture seule sur une réception déjà validée */}
      {isOpen && locked &&
      <div style={{ margin: '0 22px 14px', padding: '16px 18px', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginBottom: 12 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><Icon name="alert" size={14} color="#D97706" /><span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color: '#92400E' }}>Anomalie enregistrée · {anomaly?.qty} {sku.label.toLowerCase()} sur {got} reçu(e)s</span></span>
            <button onClick={() => onToggle(null)} title="Fermer" style={{ width: 28, height: 28, borderRadius: 7, border: '1px solid #FDE68A', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name="x" size={14} color="#92400E" /></button>
          </div>
          {anomaly?.comment &&
        <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color: '#92400E', marginBottom: 6 }}>Commentaire</div>
              <div style={{ fontSize: 13, color: '#4D2528', lineHeight: 1.5, background: '#FFFFFF', border: '1px solid #FDE68A', borderRadius: 8, padding: '10px 12px' }}>{anomaly.comment}</div>
            </div>}
          <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color: '#92400E', marginBottom: 8 }}>Photo{(anomaly?.photos || []).length > 1 ? 's' : ''} jointe{(anomaly?.photos || []).length > 1 ? 's' : ''}</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            {(anomaly?.photos || []).length === 0 && <span style={{ fontSize: 12, color: '#92400E' }}>Aucune photo</span>}
            {(anomaly?.photos || []).map((p) =>
          <div key={p.id} style={{ width: 64, height: 64 }}>
                {p.url ?
            <img src={p.url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 8, border: '1px solid #FDE68A', display: 'block' }} /> :
            <div style={{ width: '100%', height: '100%', borderRadius: 8, border: '1px solid #FDE68A', background: '#FEF3C7', display: 'grid', placeItems: 'center' }}><CameraIcon7 size={20} color="#D97706" /></div>}
              </div>)}
          </div>
        </div>}

      {/* Panneau anomalie inline avec photo obligatoire */}
      {isOpen && !locked &&
      <div style={{ margin: '0 22px 14px', padding: '16px 18px', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 10 }}>
          {/* En-tête avec fermeture */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginBottom: 14 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color: '#92400E' }}><Icon name="alert" size={14} color="#D97706" />Déclarer une anomalie · {sku.label}</span>
            <button onClick={() => onToggle(null)} title="Fermer" style={{ width: 28, height: 28, borderRadius: 7, border: '1px solid #FDE68A', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name="x" size={14} color="#92400E" /></button>
          </div>
          {/* Quantité */}
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color: '#92400E', marginBottom: 10 }}>Combien de {sku.label} sont concerné(e)s ?</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 16 }}>
            <button onClick={() => setQty(Math.max(0, qty - 1))} style={stepAmber7}><Icon name="minus" size={14} color="#92400E" /></button>
            <input type="number" value={qty} min={0} max={got} onChange={(e) => setQty(Math.max(0, Math.min(got, parseInt(e.target.value) || 0)))} style={{ width: 60, padding: '7px 10px', borderRadius: 8, border: '1px solid #FDE68A', background: '#FFFFFF', fontFamily: 'inherit', fontSize: 18, fontWeight: 800, color: '#4D2528', textAlign: 'center' }} />
            <button onClick={() => setQty(Math.min(got, qty + 1))} style={stepAmber7}><Icon name="plus" size={14} color="#92400E" /></button>
            <span style={{ fontSize: 12, color: '#92400E' }}>sur <strong>{got}</strong> reçu(e)s</span>
          </div>

          {/* Photo OBLIGATOIRE */}
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 8 }}>
            <span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color: '#92400E' }}>Photo de l'anomalie</span>
            <span style={{ fontSize: 10, fontWeight: 700, color: '#DC2626', background: '#FEF2F2', padding: '1px 7px', borderRadius: 4 }}>Obligatoire</span>
          </div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            {photos.map((p) =>
          <div key={p.id} style={{ position: 'relative', width: 64, height: 64 }}>
                {p.url ?
            <img src={p.url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 8, border: '1px solid #FDE68A', display: 'block' }} /> :
            <div style={{ width: '100%', height: '100%', borderRadius: 8, border: '1px solid #FDE68A', background: '#FEF3C7', display: 'grid', placeItems: 'center' }}><CameraIcon7 size={20} color="#D97706" /></div>}
                <button onClick={() => setPhotos((ph) => ph.filter((x) => x.id !== p.id))} style={{ position: 'absolute', top: -6, right: -6, width: 20, height: 20, borderRadius: '50%', background: '#4D2528', border: '2px solid #FFFBEB', cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0 }}><Icon name="x" size={10} color="#FFFFFF" /></button>
              </div>)}
            <div onClick={() => fileRef.current && fileRef.current.click()} style={{ width: 64, height: 64, borderRadius: 8, border: '2px dashed #FBBF24', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center' }}>
              <CameraIcon7 size={22} color="#D97706" />
            </div>

const { useState: useStStk, useMemo: useMemoStk } = React;

const statusOfStk = (n, t) => { if (!t) return 'ok'; const p = n / t * 100; return p < 80 ? 'critique' : p <= 120 ? 'attention' : 'ok'; };
const toneStk = { critique: { color: '#4D2528', label: 'Critique' }, attention: { color: '#4D2528', label: 'Attention' }, ok: { color: '#5E4040', label: 'OK' } };

function StocksV7({ goto, pendingReceptions, onAnomalie }) {
  /* État mutable du stock */
  const [rows, setRows] = useStStk(() => STOCK_V7.map((s) => ({ ...s })));
  const [activeDept, setActiveDept] = useStStk('global');
  const [quickEdit, setQuickEdit] = useStStk(null); // sku en cours d'édition rapide
  const [quickVal, setQuickVal] = useStStk('');
  const [invOpen, setInvOpen] = useStStk(false);
  const [anomalySku, setAnomalySku] = useStStk(null);
  const [toast, setToast] = useStStk(null);
  const [history, setHistory] = useStStk(() => INVENTORY_HISTORY_V7.map((h) => ({ ...h })));
  const [query, setQuery] = useStStk('');

  React.useEffect(() => { setQuery(''); }, [activeDept]);

  const alert = activeDept !== 'global' ? inventoryDiscrepancyAlert(activeDept) : null;
  const flaggedDepts = deptsWithDiscrepancy();

  const visible = activeDept === 'global' ? rows : rows.filter((r) => r.dept === activeDept);
  const q = query.trim().toLowerCase();
  const filtered = q ? visible.filter((r) => (skuOfV7(r.sku).label || '').toLowerCase().includes(q) || r.sku.toLowerCase().includes(q)) : visible;
  const sorted = filtered.slice().sort((a, b) => {
    const o = { critique: 0, attention: 1, ok: 2 };
    return o[statusOfStk(a.niveau, a.tampon)] - o[statusOfStk(b.niveau, b.tampon)];
  });

  const totalNiveau = visible.reduce((s, r) => s + r.niveau, 0);
  const nbCrit = visible.filter((r) => statusOfStk(r.niveau, r.tampon) === 'critique').length;
  const nbManual = visible.filter((r) => r.manual).length;

  /* Mise à jour rapide à la ligne */
  const openQuick = (sku) => { const r = rows.find((x) => x.sku === sku); setQuickEdit(sku); setQuickVal(String(r.niveau)); };
  const saveQuick = (sku) => {
    const n = Math.max(0, parseInt(quickVal, 10) || 0);
    const r = rows.find((x) => x.sku === sku);
    const ecart = n - r.niveau;
    setRows((rs) => rs.map((x) => x.sku === sku ? { ...x, niveau: n, manual: true, lastInventory: 'À l\'instant', ecartLastInv: ecart } : x));
    if (ecart !== 0) {
      setHistory((h) => [{ id: `INV-${Math.floor(Math.random() * 9000 + 1000)}`, date: 'À l\'instant', dept: r.dept, by: USER_V4.name, mode: 'rapide', articles: 1, ecart }, ...h]);
    }
    setToast(`${skuOfV7(sku).label} mis à jour · ${n} pièces`);
    setQuickEdit(null);
  };

  /* Validation d'un inventaire complet */
  const applyInventory = (dept, counts) => {
    let cumul = 0, touched = 0;
    setRows((rs) => rs.map((x) => {
      if (counts[x.sku] == null || counts[x.sku] === '') return x;
      const real = Math.max(0, parseInt(counts[x.sku], 10) || 0);
      const ecart = real - x.niveau;
      if (real !== x.niveau) { cumul += ecart; touched++; }
      return { ...x, niveau: real, manual: true, lastInventory: 'À l\'instant', ecartLastInv: ecart };
    }));
    setHistory((h) => [{ id: `INV-${Math.floor(Math.random() * 9000 + 1000)}`, date: 'À l\'instant', dept: dept === 'global' ? 'hebergement' : dept, by: USER_V4.name, mode: 'complet', articles: touched, ecart: cumul }, ...h]);
    setInvOpen(false);
    setToast(touched ? `Inventaire validé · ${touched} article${touched > 1 ? 's' : ''} ajusté${touched > 1 ? 's' : ''} (${cumul > 0 ? '+' : ''}${cumul} pcs)` : 'Inventaire validé · aucun écart');
  };

  return (
    <ShellV7
      active="linge/stocks" onNavigate={goto} pendingReceptions={pendingReceptions} onAnomalie={onAnomalie}
      kicker={USER_V4.hotel}
      title="Stocks"
      sub="Suivi du stock par département. Lancez un inventaire pour recaler le stock réel, ou ajustez une ligne ponctuellement."
      right={<Cta7 size="lg" icon={<Icon name="clipboard" size={16} color="#FFFFFF" />} onClick={() => setInvOpen(true)}>Lancer un inventaire</Cta7>}>


      {/* Onglets départements (underlined) */}
      <div style={{ display: 'flex', gap: 4, borderBottom: '1px solid #E5E5E5', flexWrap: 'wrap' }}>
        <StockTab7 active={activeDept === 'global'} label="Tous les départements" icon="layers" onClick={() => setActiveDept('global')} />
        {DEPARTMENTS_V7.map((d) => {
          const items = rows.filter((r) => r.dept === d.id);
          const c = items.filter((r) => statusOfStk(r.niveau, r.tampon) === 'critique').length;
          const a = items.filter((r) => statusOfStk(r.niveau, r.tampon) === 'attention').length;
          return <StockTab7 key={d.id} active={activeDept === d.id} label={d.label} deptId={d.id} count={c} attCount={a} alert={flaggedDepts.includes(d.id)} onClick={() => setActiveDept(d.id)} />;
        })}
      </div>

      {/* KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>
        <Kpi7 label={activeDept === 'global' ? 'Stock total' : `Stock · ${deptOf(activeDept).label}`} value={totalNiveau.toLocaleString('fr-FR')} unit="pièces" />
        <Kpi7 label="Articles critiques" value={nbCrit} tone={nbCrit ? 'critique' : 'ok'} />
        <Kpi7 label="Mis à jour par inventaire" value={nbManual} sub="stock réel saisi manuellement" />
      </div>

      {/* Alerte écarts récurrents — sous le département concerné uniquement */}
      {alert &&
        <div style={{ background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 14, padding: '16px 20px', display: 'flex', alignItems: 'flex-start', gap: 14 }}>
          <div style={{ width: 38, height: 38, borderRadius: 10, background: '#FEF3C7', display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name="alert" size={18} color="#D97706" /></div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 800, fontSize: 15, color: '#92400E', marginBottom: 3 }}>Écarts d'inventaire récurrents · {deptOf(activeDept).label}</div>
            <div style={{ fontSize: 13, color: '#92400E', lineHeight: 1.5, opacity: 0.9 }}>{alert.message}</div>
          </div>
        </div>}

      {/* Liste */}
      <Card7 padded={false}>
        <div style={{ padding: '16px 22px', borderBottom: '1px solid #F0F0F0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040', whiteSpace: 'nowrap' }}>{activeDept === 'global' ? 'Niveaux de stock' : deptOf(activeDept).label}</div>
            <div style={{ fontWeight: 700, fontSize: 16, color: '#4D2528', marginTop: 3, whiteSpace: 'nowrap' }}>{sorted.length} article{sorted.length > 1 ? 's' : ''}{q && <span style={{ fontWeight: 500, color: '#7A6060' }}> sur {visible.length}</span>}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexShrink: 0 }}>
            <div style={{ position: 'relative', width: 240 }}>
              <span style={{ position: 'absolute', left: 11, top: '50%', transform: 'translateY(-50%)', display: 'grid', placeItems: 'center', pointerEvents: 'none' }}><Icon name="search" size={15} color="#9A9A9A" /></span>
              <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Rechercher un linge…"
                style={{ width: '100%', padding: '9px 32px 9px 34px', borderRadius: 9, border: '1px solid #E5E5E5', fontFamily: 'inherit', fontSize: 13.5, color: '#4D2528', background: '#FAFAFA', boxSizing: 'border-box' }} />
              {query && <button onClick={() => setQuery('')} title="Effacer" style={{ position: 'absolute', right: 7, top: '50%', transform: 'translateY(-50%)', width: 22, height: 22, borderRadius: 6, border: 0, background: 'transparent', cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0 }}><Icon name="x" size={14} color="#9A9A9A" /></button>}
            </div>
            <div style={{ fontSize: 11, color: '#5E4040', display: 'inline-flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap' }}>
              <span style={{ width: 10, height: 10, borderRadius: '50%', background: '#FEF3C7', border: '1px solid #FDE68A', flexShrink: 0 }} /> Mis à jour par inventaire
            </div>
          </div>
        </div>
        {sorted.length === 0 &&
          <div style={{ padding: '34px 22px', textAlign: 'center' }}>
            <Icon name="search" size={26} color="#C8C8C8" />
            <div style={{ fontSize: 14, color: '#5E4040', marginTop: 10 }}>Aucun linge ne correspond à « {query} »</div>
          </div>}
        {sorted.map((item, i) => {
          const anomalies = anomaliesOfSku(item.sku);
          return (
          <StockRow7 key={item.sku} item={item} last={i === sorted.length - 1} isGlobal={activeDept === 'global'}
            editing={quickEdit === item.sku} quickVal={quickVal} setQuickVal={setQuickVal}
            anomalies={anomalies} onAnomalies={() => setAnomalySku(item.sku)}
            onEdit={() => openQuick(item.sku)} onCancel={() => setQuickEdit(null)} onSave={() => saveQuick(item.sku)} />);
        })}
      </Card7>

      {/* Historique des inventaires (secondaire) */}
      <div>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040', marginBottom: 10 }}>Historique des inventaires</div>
        <Card7 padded={false}>
          <div style={{ padding: '12px 22px', borderBottom: '1px solid #F0F0F0', display: 'grid', gridTemplateColumns: '120px 1fr 130px 90px 100px', gap: 12, fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040' }}>
            <span>Date</span><span>Département</span><span>Par</span><span style={{ textAlign: 'right' }}>Articles</span><span style={{ textAlign: 'right' }}>Écart réel</span>
          </div>
          {history.slice(0, 8).map((h, i) => (
            <div key={h.id + i} style={{ padding: '12px 22px', borderTop: i ? '1px solid #F5F5F5' : 0, display: 'grid', gridTemplateColumns: '120px 1fr 130px 90px 100px', gap: 12, alignItems: 'center', fontSize: 13 }}>
              <span style={{ color: '#5E4040', fontSize: 12 }}>{h.date}</span>
              <span style={{ color: '#4D2528', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                <DeptIcon7 id={h.dept} size={14} color="#6B6B6B" />{deptOf(h.dept)?.label || h.dept}
                <span style={{ fontSize: 10, fontWeight: 700, color: '#7A6060', textTransform: 'uppercase' }}>· {h.mode}</span>
              </span>
              <span style={{ color: '#5E4040', fontSize: 12 }}>{h.by}</span>
              <span style={{ textAlign: 'right', color: '#4D2528', fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{h.articles}</span>
              <span style={{ textAlign: 'right' }}>
                {h.ecart === 0
                  ? <span style={{ fontSize: 12, color: '#7A6060' }}>Aucun</span>
                  : <span style={{ fontWeight: 800, fontSize: 15, color: h.ecart < 0 ? '#B91C1C' : '#4D2528', fontVariantNumeric: 'tabular-nums' }}>{h.ecart > 0 ? '+' : ''}{h.ecart}</span>}
              </span>
            </div>))}
        </Card7>
      </div>

      {invOpen && <InventoryModal7 rows={rows} onClose={() => setInvOpen(false)} onApply={applyInventory} />}
      {anomalySku && <AnomalyDrawer7 sku={anomalySku} anomalies={anomaliesOfSku(anomalySku)} onClose={() => setAnomalySku(null)} />}
      <FixedToast7 message={toast} onClose={() => setToast(null)} />
    </ShellV7>);
}

    <div style={{ padding: '16px 22px', borderBottom: last ? 0 : '1px solid #F0F0F0' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 120px 1fr 150px 140px', gap: 18, alignItems: 'center' }}>

            </div>
            <div style={{ fontSize: 11, color: '#5E4040', marginTop: 2 }}>Seuil tampon {item.tampon}{isGlobal && ` · ${deptOf(item.dept)?.label}`}</div>
          </div>
        </div>

          <div style={{ fontWeight: 900, fontSize: 28, letterSpacing: '-0.02em', color: tone.color, fontVariantNumeric: 'tabular-nums' }}>{item.niveau.toLocaleString('fr-FR')}</div>

const { useState: useStCh, useRef: useRefCh, useEffect: useEffectCh } = React;

/* ============================================================
   CHAMBRES — paramétrage de l'organisation de l'hôtel
   · Catégories de chambre + nombre de chambres par catégorie
   · Linge (type + quantité) associé à chaque catégorie de chambre
   Rendu sans Shell : hébergé dans Paramétrage établissement › Chambres
   ============================================================ */
function ChambresPanel7() {
  const [types, setTypes] = useStCh(() => ROOM_TYPES_V7.map((r) => ({ ...r, linen: { ...r.linen } })));
  const [editing, setEditing] = useStCh(null);
  const [toast, setToast] = useStCh(null);
  const [scrollTarget, setScrollTarget] = useStCh(null);
  const cardRefs = useRefCh({});

  useEffectCh(() => {
    if (!scrollTarget) return;
    const t = setTimeout(() => {
      const el = cardRefs.current[scrollTarget];
      if (el) {
        const top = el.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top, behavior: 'auto' });
      } else {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'auto' });
      }
      setScrollTarget(null);
    }, 120);
    return () => clearTimeout(t);
  }, [scrollTarget]);

  const totalRooms = types.reduce((s, t) => s + t.count, 0);
  const totalPieces = types.reduce((s, t) => s + t.count * Object.values(t.linen).reduce((a, b) => a + b, 0), 0);

  const update = (id, patch) => setTypes((ts) => ts.map((t) => t.id === id ? { ...t, ...patch } : t));
  const setLinen = (id, sku, qty) => setTypes((ts) => ts.map((t) => {
    if (t.id !== id) return t;
    const linen = { ...t.linen };
    if (qty <= 0) delete linen[sku];else linen[sku] = qty;
    return { ...t, linen };
  }));
  const addType = () => {
    const id = `cat-${Date.now()}`;
    setTypes((ts) => [...ts, { id, label: 'Nouvelle catégorie de chambre', count: 0, pax: 2, linen: {} }]);
    setEditing(id);
    setScrollTarget(id);
  };
  const removeType = (id) => {setTypes((ts) => ts.filter((t) => t.id !== id));setEditing(null);setToast('Catégorie de chambre supprimée');};
  const save = () => {setEditing(null);setToast('Configuration enregistrée');};

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 800, fontSize: 20, color: '#4D2528', letterSpacing: '-0.01em' }}>Catégories de chambre &amp; linge</div>
          <div style={{ fontSize: 13, color: '#5E4040', marginTop: 4, maxWidth: 720 }}>Définissez vos catégories de chambre, le nombre de chambres et le linge associé à chacune.</div>
        </div>
        <Cta7 icon={<Icon name="plus" size={16} color="#FFFFFF" />} onClick={addType}>Ajouter une catégorie</Cta7>
      </div>

      {/* KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>
        <Kpi7 label="Catégories de chambre" value={types.length} />
        <Kpi7 label="Chambres au total" value={totalRooms} unit="chambres" />
        <Kpi7 label="Setup linge théorique" value={totalPieces.toLocaleString('fr-FR')} unit="pièces" sub="si toutes les chambres sont occupées" />
      </div>

      {/* Cartes par catégorie de chambre */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        {types.map((t) =>
        <div key={t.id} ref={(el) => {cardRefs.current[t.id] = el;}}>
            <RoomTypeCard7 type={t} editing={editing === t.id}
          onEdit={() => setEditing(t.id)} onSave={save} onRemove={() => removeType(t.id)}
          onUpdate={(patch) => update(t.id, patch)} onSetLinen={(sku, qty) => setLinen(t.id, sku, qty)} />
          </div>
        )}
      </div>

      <FixedToast7 message={toast} onClose={() => setToast(null)} />
    </div>);
}

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 13, color: '#4D2528', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{skuOfV7(sku).label}</div>
                </div>
                {editing ?
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                      <button onClick={() => onSetLinen(sku, qty - 1)} style={chStep7}><Icon name="minus" size={12} color="#1A1A1A" /></button>
                      <span style={{ minWidth: 24, textAlign: 'center', fontWeight: 800, fontSize: 15, color: '#4D2528', fontVariantNumeric: 'tabular-nums' }}>{qty}</span>

                    </div> :
              <span style={{ fontWeight: 800, fontSize: 16, color: '#4D2528', fontVariantNumeric: 'tabular-nums' }}>×{qty}</span>}
              </div>)}
          </div>

          {/* Ajout d'un linge */}
          {editing && availableSkus.length > 0 &&
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 14 }}>
              <select value={addSku} onChange={(e) => setAddSku(e.target.value)}

/* ============================================================
   LINGES — catalogue éditable
   ============================================================ */
function LingesPanel8() {
  const clone = (l) => ({ ...l, depts: [...l.depts], tampons: { ...l.tampons } });
  const [linges, setLinges] = useStPar(() => getLinges().map(clone));
  const [editing, setEditing] = useStPar(null);
  const [filter, setFilter] = useStPar('all');
  const [toast, setToast] = useStPar(null);
  const rowRefs = useRefPar({});

  const persist = (next) => { setLinges(next); saveLinges(next.map(clone)); };
  const update = (sku, patch) => persist(linges.map((l) => l.sku === sku ? { ...l, ...patch } : l));
  const toggleDept = (sku, dept) => persist(linges.map((l) => {
    if (l.sku !== sku) return l;
    const has = l.depts.includes(dept);
    let depts; const tampons = { ...l.tampons };
    if (has) { depts = l.depts.filter((d) => d !== dept); delete tampons[dept]; }
    else { depts = [...l.depts, dept]; tampons[dept] = tampons[dept] || 100; }
    return depts.length ? { ...l, depts, tampons } : l;
  }));
  const setTampon = (sku, dept, v) => persist(linges.map((l) => l.sku === sku ? { ...l, tampons: { ...l.tampons, [dept]: Math.max(0, v) } } : l));
  const addLinge = () => {
    const sku = `linge-${Date.now().toString(36)}`;
    const dept = filter === 'all' ? 'hebergement' : filter;
    persist([...linges, { sku, name: 'Nouveau linge', supplier: SUPPLIERS[0].id, depts: [dept], tampons: { [dept]: 100 }, category: 'serviette' }]);
    setEditing(sku);
    setTimeout(() => { const el = rowRefs.current[sku]; if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90 }); }, 80);
  };
  const removeLinge = (sku) => { persist(linges.filter((l) => l.sku !== sku)); setEditing(null); setToast('Linge supprimé'); };
  const save = () => { setEditing(null); setToast('Linge enregistré'); };

  const visible = filter === 'all' ? linges : linges.filter((l) => l.depts.includes(filter));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.4, textTransform: 'uppercase', color: '#7A6060', marginRight: 2 }}>Filtrer</span>
          <FilterPill8 active={filter === 'all'} label="Tous" onClick={() => setFilter('all')} />
          {DEPARTMENTS_V7.map((d) => <FilterPill8 key={d.id} active={filter === d.id} label={d.label} deptId={d.id} onClick={() => setFilter(d.id)} />)}
        </div>
        <Cta7 icon={<Icon name="plus" size={16} color="#FFFFFF" />} onClick={addLinge}>Ajouter un linge</Cta7>
      </div>

      <Card7 padded={false}>
        {visible.length === 0 && <div style={{ padding: '28px', textAlign: 'center', color: '#7A6060', fontSize: 13 }}>Aucun linge dans ce département.</div>}
        {visible.map((l, i) =>
          <div key={l.sku} ref={(el) => { rowRefs.current[l.sku] = el; }}>
            <LingeRow8 linge={l} editing={editing === l.sku} last={i === visible.length - 1}
              onEdit={() => setEditing(l.sku)} onSave={save} onRemove={() => removeLinge(l.sku)}
              onUpdate={(patch) => update(l.sku, patch)} onToggleDept={(d) => toggleDept(l.sku, d)} onSetTampon={(d, v) => setTampon(l.sku, d, v)} />
          </div>)}
      </Card7>

      <FixedToast7 message={toast} onClose={() => setToast(null)} />
    </div>);
}

      background: active ? '#4D2528' : '#FFFFFF', color: active ? '#FFFFFF' : '#5E4040', border: `1px solid ${active ? '#4D2528' : '#D4D4D4'}` }}>

/* ============================================================

function CoefficientsPanel8() {

  const [toast, setToast] = useStPar(null);

  const persistEvents = (next) => { setEvents(next); saveEvents(next.map((e) => ({ ...e }))); };
  const persistRules = (next) => { setRules(next); saveWeatherRules(next.map((r) => ({ ...r }))); };

  const addEvent = () => persistEvents([...events, { id: `ev-${Date.now().toString(36)}`, name: 'Nouvel évènement', start: '', end: '', coef: 1.1, active: true }]);
  const updEvent = (id, patch) => persistEvents(events.map((e) => e.id === id ? { ...e, ...patch } : e));
  const delEvent = (id) => { persistEvents(events.filter((e) => e.id !== id)); setToast('Évènement supprimé'); };

  const addRule = () => persistRules([...rules, { id: `wr-${Date.now().toString(36)}`, threshold: 30, coef: 1.1 }].sort((a, b) => a.threshold - b.threshold));
  const updRule = (id, patch) => persistRules(rules.map((r) => r.id === id ? { ...r, ...patch } : r));
  const delRule = (id) => { persistRules(rules.filter((r) => r.id !== id)); setToast('Règle météo supprimée'); };

  const pct = (c) => `${c >= 1 ? '+' : ''}${Math.round((c - 1) * 100)} %`;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
      <div style={{ background: '#FAFAFA', border: '1px solid #E5E5E5', borderRadius: 12, padding: '14px 18px', fontSize: 13, color: '#5E4040', lineHeight: 1.55, display: 'flex', alignItems: 'flex-start', gap: 12 }}>
        <Icon name="info" size={17} color="#6B6B6B" style={{ flexShrink: 0, marginTop: 1 }} />

        </Card7>

function DepartementsPanel8() {
  const clone = (d) => ({ ...d });

  const persist = (next) => { setDepts(next); saveDepartments(next.map(clone)); };
  const update = (id, patch) => persist(depts.map((d) => d.id === id ? { ...d, ...patch } : d));
  const linenCount = (id) => (typeof getLinges !== 'undefined' ? getLinges() : []).filter((l) => l.depts.includes(id)).length;
  const addDept = () => {
    const id = `dept-${Date.now().toString(36)}`;
    persist([...depts, { id, label: 'Nouveau département', icon: 'package', desc: '' }]);
    setEditing(id);
    setTimeout(() => { const el = rowRefs.current[id]; if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90 }); }, 80);
  };
  const removeDept = (id) => {
    if (linenCount(id) > 0) { setToast('Impossible : des linges sont rattachés à ce département'); return; }
    if (depts.length <= 1) { setToast('Au moins un département est requis'); return; }
    persist(depts.filter((d) => d.id !== id)); setEditing(null); setToast('Département supprimé');
  };
  const save = () => { setEditing(null); setToast('Département enregistré'); };

  return (

            <div key={d.id} ref={(el) => { rowRefs.current[d.id] = el; }} style={{ padding: '14px 18px', borderBottom: i === depts.length - 1 ? 0 : '1px solid #F0F0F0', background: isEd ? '#FAFAFA' : '#FFFFFF' }}>

                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 16, color: '#4D2528' }}>{d.label}</div>
                    <div style={{ fontSize: 12, color: '#7A6060', marginTop: 1 }}>{n} linge{n > 1 ? 's' : ''} rattaché{n > 1 ? 's' : ''}{d.desc ? ` · ${d.desc}` : ''}</div>
                  </div>
                  <Cta7 variant="ghost" size="sm" onClick={() => setEditing(d.id)} icon={<Icon name="edit" size={13} color="#1A1A1A" />}>Modifier</Cta7>
                </div> :
                <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                    <Field8 label="Nom du département"><input value={d.label} onChange={(e) => update(d.id, { label: e.target.value })} style={inp8} /></Field8>
                    <Field8 label="Description (optionnel)"><input value={d.desc || ''} placeholder="Ex : Spa, piscine, soins" onChange={(e) => update(d.id, { desc: e.target.value })} style={inp8} /></Field8>
                  </div>
                  <div>
                    <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: '#5E4040', marginBottom: 8 }}>Icône</div>
                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                      {DEPT_ICON_CHOICES_V8.map((ic) => {
                        const on = d.icon === ic;
                        return (
                          <button key={ic} onClick={() => update(d.id, { icon: ic })} title={ic} style={{ width: 44, height: 44, borderRadius: 10, cursor: 'pointer', background: on ? '#4D2528' : '#FFFFFF', border: `1.5px solid ${on ? '#4D2528' : '#D4D4D4'}`, display: 'grid', placeItems: 'center', padding: 0 }}>
                            <DeptGlyph8 ic={ic} size={20} color={on ? '#FFFFFF' : '#5E4040'} />
                          </button>);
                      })}
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', alignItems: 'center' }}>
                    {n > 0 && <span style={{ fontSize: 11.5, color: '#7A6060', marginRight: 'auto' }}>{n} linge{n > 1 ? 's' : ''} rattaché{n > 1 ? 's' : ''} — suppression bloquée</span>}
                    <button onClick={() => removeDept(d.id)} disabled={n > 0} style={{ padding: '9px 14px', borderRadius: 9, background: '#FFFFFF', border: '1px solid #E5E5E5', cursor: n > 0 ? 'not-allowed' : 'pointer', opacity: n > 0 ? 0.5 : 1, display: 'inline-flex', alignItems: 'center', gap: 7, fontFamily: 'inherit', fontSize: 13, color: '#B91C1C', fontWeight: 600 }}><Icon name="trash" size={15} color="#B91C1C" />Supprimer</button>
                    <Cta7 onClick={save} icon={<Icon name="check" size={15} color="#FFFFFF" />}>Terminer</Cta7>
                  </div>

        })}
      </Card7>

      <FixedToast7 message={toast} onClose={() => setToast(null)} />
    </div>);

function AnomalieModal({ onClose }) {
  const { useState: useStM, useRef: useRfM, useEffect: useEfM } = React;

  const [photos, setPhotos] = useStM([]);
  const [qtys, setQtys] = useStM({});
  const [addedKeys, setAddedKeys] = useStM([]);
  const [pickOpen, setPickOpen] = useStM(false);
  const [comment, setComment] = useStM('');
  const [anomDept, setAnomDept] = useStM('hebergement');
  const [isDragging, setIsDragging] = useStM(false);
  const [submitted, setSubmitted] = useStM(false);
  const fileRef = useRfM(null);

  const linges = typeof getLinges !== 'undefined' ? getLinges() : [];
  const depts = typeof DEPARTMENTS_V7 !== 'undefined' ? DEPARTMENTS_V7 : [];
  const byDept = {};
  depts.forEach((d) => {byDept[d.id] = [];});
  linges.forEach((l) => l.depts.forEach((d) => {(byDept[d] = byDept[d] || []).push(l);}));
  const totalPieces = Object.values(qtys).reduce((s, v) => s + (Number(v) || 0), 0);
  const setQty = (key, v) => setQtys((q) => ({ ...q, [key]: Math.max(0, v) }));
  const anomStep = { width: 28, height: 28, borderRadius: 7, border: '1px solid #D4D4D4', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0 };

  const lingeBySku = (sku) => linges.find((l) => l.sku === sku) || (typeof lingeOf !== 'undefined' ? lingeOf(sku) : null);
  const addLinen = (sku) => {
    if (!sku) return;
    const key = `${sku}__${anomDept}`;
    setAddedKeys((k) => k.includes(key) ? k : [...k, key]);
    setQtys((q) => q[key] ? q : { ...q, [key]: 1 });
    setPickOpen(false);
  };
  const removeLinen = (key) => {
    setAddedKeys((k) => k.filter((x) => x !== key));
    setQtys((q) => { const n = { ...q }; delete n[key]; return n; });
  };
  const availableToAdd = (byDept[anomDept] || []).filter((l) => !addedKeys.includes(`${l.sku}__${anomDept}`));

  const canSubmit = photos.length > 0 && addedKeys.length > 0;

  /* Fermeture clavier Échap */
  useEfM(() => {
    const handler = (e) => {if (e.key === 'Escape') onClose();};
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  const addFiles = (files) => {
    const valid = Array.from(files).filter((f) => f.type.startsWith('image/'));
    const next = valid.map((f) => ({
      id: Math.random().toString(36).slice(2),
      url: URL.createObjectURL(f),
      name: f.name
    }));
    setPhotos((p) => [...p, ...next]);
  };

  const removePhoto = (id) => {
    setPhotos((p) => p.filter((x) => x.id !== id));
  };

  const handleSubmit = () => {
    setSubmitted(true);
    setTimeout(onClose, 1800);
  };

  /* ── Écran succès ── */
  if (submitted) {
    return (
      <div style={overlayStyle}>
        <div style={{ background: '#FFFFFF', borderRadius: 20, padding: '52px 44px', textAlign: 'center', maxWidth: 380, boxShadow: '0 24px 64px rgba(0,0,0,0.22)' }}>
          <div style={{ width: 60, height: 60, borderRadius: '50%', background: '#4D2528', display: 'grid', placeItems: 'center', margin: '0 auto 20px' }}>
            <Icon name="check" size={26} color="#FFFFFF" />
          </div>
          <div style={{ fontWeight: 900, fontSize: 22, color: '#4D2528', letterSpacing: '-0.02em', marginBottom: 8 }}>Anomalie déclarée</div>
          <div style={{ fontSize: 14, color: '#5E4040', lineHeight: 1.55 }}>
            L'équipe a bien été notifiée.{totalPieces > 0 ? ` ${totalPieces} pièce${totalPieces > 1 ? 's' : ''} ${totalPieces > 1 ? 'ont' : 'a'} été décrémentée${totalPieces > 1 ? 's' : ''} du stock.` : ' Un suivi sera effectué.'}
          </div>
        </div>
      </div>);

  }

  /* ── Modale principale ── */
  return (
    <div style={overlayStyle} onClick={(e) => {if (e.target === e.currentTarget) onClose();}}>
      <div style={{
        background: '#FFFFFF', borderRadius: 20,
        width: '100%', maxWidth: 580,
        maxHeight: 'calc(100vh - 48px)',
        display: 'flex', flexDirection: 'column',
        overflow: 'hidden',
        boxShadow: '0 24px 64px rgba(0,0,0,0.22)'

        {/* En-tête */}
        <div style={{ padding: '20px 24px', borderBottom: '1px solid #F0F0F0', display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0 }}>
          <div style={{ width: 38, height: 38, borderRadius: 11, background: '#4D2528', display: 'grid', placeItems: 'center', flexShrink: 0 }}>
            <AlertTriangleIcon size={18} color="#FFFFFF" />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 800, fontSize: 18, color: '#4D2528', letterSpacing: '-0.01em' }}>Déclarer une anomalie</div>
            <div style={{ fontSize: 12, color: '#5E4040', marginTop: 2 }}>Joignez une photo et indiquez le linge concerné.</div>

/* ── Signal colors — système sémantique unifié ──────────────
   Utilisé partout : barres, badges, textes, fonds.
   critique  → rouge   (stock < 80% tampon | occ ≥ 90%)
   attention → orange  (stock 80-120%      | occ 75-89%)
   ok        → vert    (stock > 120%       | occ < 75%)
   neutral   → taupe   (état indéfini)
   ──────────────────────────────────────────────────────── */
function signalColor(tone) {
  const map = {
    critique:  { bar: '#AB1B1A', text: '#AB1B1A', bg: '#FDECEA' },
    attention: { bar: '#C85710', text: '#C85710', bg: '#FFF3E0' },
    ok:        { bar: '#5A7A3E', text: '#3F6028', bg: '#EDF5E8' },
    neutral:   { bar: '#9B8880', text: '#5E4040', bg: '#F0EBE8' },
  };
  return map[tone] || map.neutral;
}
function occTone(pct) {
  if (pct >= 90) return 'critique';
  if (pct >= 75) return 'attention';
  if (pct >= 50) return 'neutral';
  return 'ok';
}
function stockTone(niveau, tampon) {
  const p = niveau / tampon * 100;
  if (p < 80) return 'critique';
  if (p <= 120) return 'attention';
  return 'ok';
}
Object.assign(window, { signalColor, occTone, stockTone });

            onMouseLeave={e => e.currentTarget.style.background='#4D2528'}>

          </button>

      )}

      {/* Pod utilisateur */}
      <div data-user-menu style={{ position: 'relative', padding: 10, borderTop: `1px solid ${SB.divider}` }}>
        <button onClick={() => setUserMenu((v) => !v)} style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 10, background: userMenu ? 'rgba(0,0,0,0.18)' : 'transparent', border: 0, padding: '8px 10px', borderRadius: 10, cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', color: '#FFFFFF' }}>

          <div style={{ flex: 1, minWidth: 0, lineHeight: 1.25 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#FFFFFF', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{USER_V4.name}</div>
            <div style={{ fontSize: 11, color: SB.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{USER_V4.role}</div>
          </div>

        </button>
        {userMenu &&
        <div style={{ position: 'absolute', left: 10, right: 10, bottom: 'calc(100% + 4px)', background: '#FFFFFF', color: '#4D2528', borderRadius: 12, boxShadow: '0 16px 40px rgba(80,35,37,0.22), 0 0 0 1px #E8E0DA', padding: 6, zIndex: 50 }}>
            <div style={{ padding: '10px 12px 8px', borderBottom: '1px solid #EDE5DF' }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#4D2528' }}>{USER_V4.name}</div>
              <div style={{ fontSize: 11, color: '#5E4040', marginTop: 1 }}>{USER_V4.email}</div>
            </div>
            <MenuItemBrand icon="user" label="Mon profil" />
            <MenuItemBrand icon="building" label="Changer d'établissement" />
            <MenuItemBrand icon="settings" label="Préférences du compte" />
            <div style={{ borderTop: '1px solid #EDE5DF', margin: '4px 0' }} />
            <MenuItemBrand icon="arrowDownR" label="Se déconnecter" danger />
          </div>
        }
      </div>
    </aside>);
}

/* ── Nav items ──────────────────────────────────────────────── */
function NavItemBrand({ item, active, muted, badge, disabled, group, onClick }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button
      onClick={disabled ? undefined : onClick}
      disabled={disabled}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        display: 'flex', alignItems: 'center', gap: 12,
        padding: '9px 12px', borderRadius: 10,
        background: active && !group ? SB.activeBg : hov && !disabled ? SB.hoverBg : 'transparent',
        color: active ? SB.activeText : disabled || muted ? SB.muted : SB.text,
        border: 0, cursor: disabled ? 'not-allowed' : 'pointer',
        textAlign: 'left', fontFamily: 'inherit',
        fontSize: 14, fontWeight: active ? 600 : 500,
        width: '100%', transition: 'background 140ms'
      }}>
      <Icon name={item.icon} size={17} color={active ? SB.activeIcon : disabled || muted ? SB.muted : SB.icon} />
      <span style={{ flex: 1 }}>{item.label}</span>
      {disabled && <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', padding: '2px 6px', borderRadius: 4, color: SB.muted, border: `1px solid ${SB.divider}` }}>Bientôt</span>}
      {badge && !disabled && <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.4, textTransform: 'uppercase', padding: '2px 7px', borderRadius: 4, background: 'rgba(0,0,0,0.22)', color: SB.text }}>{badge}</span>}
    </button>);
}

function NavSubBrand({ label, active, badge, onClick }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '7px 12px 7px 28px', borderRadius: 8,
        background: active ? SB.activeBg : hov ? SB.hoverBg : 'transparent',
        color: active ? SB.activeText : SB.muted,
        border: 0, cursor: 'pointer', textAlign: 'left',
        fontFamily: 'inherit', fontSize: 13,
        fontWeight: active ? 600 : 400, width: '100%',
        position: 'relative', transition: 'background 140ms'
      }}>
      <span style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', width: 4, height: 4, borderRadius: '50%', background: active ? '#FAD9BB' : 'rgba(255,255,255,0.28)' }} />
