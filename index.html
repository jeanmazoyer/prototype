   · AnomalieFloatingBtn  — bouton flottant bas droite
   · AnomalieModal        — overlay de déclaration
   ============================================================ */

/* ── Bouton flottant ── */
function AnomalieFloatingBtn({ onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        position: 'fixed', bottom: 32, right: 32, zIndex: 900,
        background: '#4D2528', color: '#FFFFFF',
        border: 0, borderRadius: 14, padding: '13px 22px',
        display: 'flex', alignItems: 'center', gap: 10,
        fontFamily: 'inherit', fontSize: 14, fontWeight: 700,
        cursor: 'pointer',
        boxShadow: '0 8px 24px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.12)',
        transition: 'transform 140ms ease, box-shadow 140ms ease'
      }}
      onMouseEnter={(e) => {
        e.currentTarget.style.transform = 'translateY(-2px)';
        e.currentTarget.style.boxShadow = '0 14px 32px rgba(0,0,0,0.28), 0 4px 8px rgba(0,0,0,0.16)';
      }}
      onMouseLeave={(e) => {
        e.currentTarget.style.transform = '';
        e.currentTarget.style.boxShadow = '0 8px 24px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.12)';
      }}>
      
      <AlertTriangleIcon size={18} color="#FFFFFF" />
      Déclarer une anomalie
    </button>);

}

/* Icône triangle alerte (SVG inline) */
function AlertTriangleIcon({ size = 18, color = 'currentColor' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M10.3 3.86L1.82 18a2 2 0 0 0 1.7 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0z" />
      <line x1="12" y1="9" x2="12" y2="13" />
      <line x1="12" y1="17" x2="12.01" y2="17" />
    </svg>);

}

/* Icône appareil photo */
function CameraIcon({ size = 22, color = '#7A6060' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </svg>);

}

/* ── Modale anomalie ── */
function AnomalieModal({ onClose }) {
  const { useState: useStM, useRef: useRfM, useEffect: useEfM } = React;

  const [photos, setPhotos] = useStM([]);
  const [qtys, setQtys] = useStM({});
  const [addedKeys, setAddedKeys] = useStM([]);
  const [pickOpen, setPickOpen] = useStM(false);
  const [comment, setComment] = useStM('');
  const [anomDept, setAnomDept] = useStM('hebergement');
  const [isDragging, setIsDragging] = useStM(false);
  const [submitted, setSubmitted] = useStM(false);
  const fileRef = useRfM(null);

  const linges = typeof getLinges !== 'undefined' ? getLinges() : [];
  const depts = typeof DEPARTMENTS_V7 !== 'undefined' ? DEPARTMENTS_V7 : [];
  const byDept = {};
  depts.forEach((d) => {byDept[d.id] = [];});
  linges.forEach((l) => l.depts.forEach((d) => {(byDept[d] = byDept[d] || []).push(l);}));
  const totalPieces = Object.values(qtys).reduce((s, v) => s + (Number(v) || 0), 0);
  const setQty = (key, v) => setQtys((q) => ({ ...q, [key]: Math.max(0, v) }));
  const anomStep = { width: 28, height: 28, borderRadius: 7, border: '1px solid #D4D4D4', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0 };

  const lingeBySku = (sku) => linges.find((l) => l.sku === sku) || (typeof lingeOf !== 'undefined' ? lingeOf(sku) : null);
  const addLinen = (sku) => {
    if (!sku) return;
    const key = `${sku}__${anomDept}`;
    setAddedKeys((k) => k.includes(key) ? k : [...k, key]);
    setQtys((q) => q[key] ? q : { ...q, [key]: 1 });
    setPickOpen(false);
  };
  const removeLinen = (key) => {
    setAddedKeys((k) => k.filter((x) => x !== key));
    setQtys((q) => { const n = { ...q }; delete n[key]; return n; });
  };
  const availableToAdd = (byDept[anomDept] || []).filter((l) => !addedKeys.includes(`${l.sku}__${anomDept}`));

  const canSubmit = photos.length > 0 && addedKeys.length > 0;

  /* Fermeture clavier Échap */
  useEfM(() => {
    const handler = (e) => {if (e.key === 'Escape') onClose();};
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  const addFiles = (files) => {
    const valid = Array.from(files).filter((f) => f.type.startsWith('image/'));
    const next = valid.map((f) => ({
      id: Math.random().toString(36).slice(2),
      url: URL.createObjectURL(f),
      name: f.name
    }));
    setPhotos((p) => [...p, ...next]);
  };

  const removePhoto = (id) => {
    setPhotos((p) => p.filter((x) => x.id !== id));
  };

  const handleSubmit = () => {
    setSubmitted(true);
    setTimeout(onClose, 1800);
  };

  /* ── Écran succès ── */
  if (submitted) {
    return (
      <div style={overlayStyle}>
        <div style={{ background: '#FFFFFF', borderRadius: 20, padding: '52px 44px', textAlign: 'center', maxWidth: 380, boxShadow: '0 24px 64px rgba(0,0,0,0.22)' }}>
          <div style={{ width: 60, height: 60, borderRadius: '50%', background: '#4D2528', display: 'grid', placeItems: 'center', margin: '0 auto 20px' }}>
            <Icon name="check" size={26} color="#FFFFFF" />
          </div>
          <div style={{ fontWeight: 900, fontSize: 22, color: '#4D2528', letterSpacing: '-0.02em', marginBottom: 8 }}>Anomalie déclarée</div>
          <div style={{ fontSize: 14, color: '#5E4040', lineHeight: 1.55 }}>
            L'équipe a bien été notifiée.{totalPieces > 0 ? ` ${totalPieces} pièce${totalPieces > 1 ? 's' : ''} ${totalPieces > 1 ? 'ont' : 'a'} été décrémentée${totalPieces > 1 ? 's' : ''} du stock.` : ' Un suivi sera effectué.'}
          </div>
        </div>
      </div>);

  }

  /* ── Modale principale ── */
  return (
    <div style={overlayStyle} onClick={(e) => {if (e.target === e.currentTarget) onClose();}}>
      <div style={{
        background: '#FFFFFF', borderRadius: 20,
        width: '100%', maxWidth: 580,
        maxHeight: 'calc(100vh - 48px)',
        display: 'flex', flexDirection: 'column',
        overflow: 'hidden',
        boxShadow: '0 24px 64px rgba(0,0,0,0.22)'
      }}>

        {/* En-tête */}
        <div style={{ padding: '20px 24px', borderBottom: '1px solid #F0F0F0', display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0 }}>
          <div style={{ width: 38, height: 38, borderRadius: 11, background: '#4D2528', display: 'grid', placeItems: 'center', flexShrink: 0 }}>
            <AlertTriangleIcon size={18} color="#FFFFFF" />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 800, fontSize: 18, color: '#4D2528', letterSpacing: '-0.01em' }}>Déclarer une anomalie</div>
            <div style={{ fontSize: 12, color: '#5E4040', marginTop: 2 }}>Joignez une photo et indiquez le linge concerné.</div>
          </div>
          <button onClick={onClose} style={{ width: 32, height: 32, borderRadius: 8, border: '1px solid #E5E5E5', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', flexShrink: 0 }}>
            <Icon name="x" size={16} color="#6B6B6B" />
          </button>
        </div>

        {/* Corps scrollable */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '22px 24px', display: 'flex', flexDirection: 'column', gap: 24 }}>

          {/* ── Photos ── */}
          <section>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 12 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: '#4D2528' }}>Photos</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: '#DC2626', background: '#FEF2F2', padding: '1px 7px', borderRadius: 4 }}>Obligatoire</span>
            </div>

            {/* Zone de dépôt */}
            <div
              onDragOver={(e) => {e.preventDefault();setIsDragging(true);}}
              onDragLeave={() => setIsDragging(false)}
              onDrop={(e) => {e.preventDefault();setIsDragging(false);addFiles(e.dataTransfer.files);}}
              onClick={() => fileRef.current && fileRef.current.click()}
              style={{
                border: `2px dashed ${isDragging ? '#4D2528' : '#D4D4D4'}`,
                borderRadius: 12, padding: '28px 20px', textAlign: 'center',
                cursor: 'pointer',
                background: isDragging ? '#F5F5F5' : '#FAFAFA',
                transition: 'all 120ms ease'
              }}>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 10 }}>
                <CameraIcon size={28} color={isDragging ? '#4D2528' : '#7A6060'} />
              </div>
              <div style={{ fontSize: 14, fontWeight: 600, color: '#4D2528', marginBottom: 4 }}>
                Déposer des photos ici
              </div>
              <div style={{ fontSize: 12, color: '#7A6060' }}>ou cliquer pour sélectionner · JPG, PNG, HEIC</div>
              <input ref={fileRef} type="file" accept="image/*" multiple
              onChange={(e) => addFiles(e.target.files)}
              style={{ display: 'none' }} />
            </div>

            {/* Aperçus */}
            {photos.length > 0 &&
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 12 }}>
                {photos.map((p) =>
              <div key={p.id} style={{ position: 'relative', width: 76, height: 76 }}>
                    <img src={p.url} alt={p.name} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 8, border: '1px solid #E5E5E5', display: 'block' }} />
                    <button onClick={() => removePhoto(p.id)} style={{ position: 'absolute', top: -6, right: -6, width: 20, height: 20, borderRadius: '50%', background: '#4D2528', border: '2px solid #FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0 }}>
                      <Icon name="x" size={10} color="#FFFFFF" />
                    </button>
                  </div>
              )}
                {/* Bouton ajout supplémentaire */}
                <div onClick={() => fileRef.current && fileRef.current.click()} style={{ width: 76, height: 76, borderRadius: 8, border: '2px dashed #D4D4D4', background: '#FAFAFA', cursor: 'pointer', display: 'grid', placeItems: 'center' }}>
                  <Icon name="plus" size={20} color="#9A9A9A" />
                </div>
              </div>
            }
          </section>

          {/* ── Linge concerné + quantités (décrémentent le stock) ── */}
          <section data-comment-anchor="ddd5f4bc2f-section-204-11">
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 6 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: '#4D2528' }}>Quel linge est concerné ?</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: '#DC2626', background: '#FEF2F2', padding: '1px 7px', borderRadius: 4 }}>Obligatoire</span>
            </div>
            <div style={{ fontSize: 12, color: '#5E4040', marginBottom: 14 }}>Choisissez un département, ajoutez le ou les linges concernés et indiquez la quantité. Ces quantités viendront décrémenter le stock.</div>

            {/* Navigation par département */}
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
              {depts.map((d) =>
                <button key={d.id} onClick={() => { setAnomDept(d.id); setPickOpen(false); }} style={{ padding: '9px 16px', borderRadius: 999, fontFamily: 'inherit', fontSize: 13, fontWeight: 600, cursor: 'pointer', background: anomDept === d.id ? '#4D2528' : '#FFFFFF', color: anomDept === d.id ? '#FFFFFF' : '#4D2528', border: `1px solid ${anomDept === d.id ? '#4D2528' : '#D4D4D4'}`, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                  <DeptIcon7 id={d.id} size={14} color={anomDept === d.id ? '#FFFFFF' : '#5E4040'} />{d.label}
                </button>)}
            </div>

            {/* Bouton « Ajouter un linge » + dropdown (adapté aux longues listes) */}
            <div style={{ position: 'relative', marginBottom: addedKeys.length ? 14 : 0 }}>
              <button onClick={() => setPickOpen((v) => !v)} disabled={availableToAdd.length === 0}
                style={{ width: '100%', padding: '11px 14px', borderRadius: 10, background: '#FFFFFF', border: `1.5px dashed ${pickOpen ? '#4D2528' : '#C8C8C8'}`, cursor: availableToAdd.length === 0 ? 'not-allowed' : 'pointer', fontFamily: 'inherit', fontSize: 13.5, fontWeight: 600, color: availableToAdd.length === 0 ? '#7A6060' : '#4D2528', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <Icon name="plus" size={15} color={availableToAdd.length === 0 ? '#7A6060' : '#4D2528'} />
                {availableToAdd.length === 0 ? 'Tous les linges de ce département sont ajoutés' : `Ajouter un linge · ${deptOf(anomDept)?.label}`}
                {availableToAdd.length > 0 && <Icon name={pickOpen ? 'chevronU' : 'chevronD'} size={14} color="#6B6B6B" />}
              </button>
              {pickOpen && availableToAdd.length > 0 &&
                <div style={{ position: 'absolute', left: 0, right: 0, top: 'calc(100% + 6px)', background: '#FFFFFF', borderRadius: 12, border: '1px solid #E5E5E5', boxShadow: '0 16px 40px rgba(0,0,0,0.16)', padding: 6, zIndex: 30, maxHeight: 280, overflowY: 'auto' }}>
                  {availableToAdd.map((l) =>
                    <button key={l.sku} onClick={() => addLinen(l.sku)} style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 8, background: 'transparent', border: 0, cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' }}
                      onMouseEnter={(e) => e.currentTarget.style.background = '#F5F5F5'}
                      onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
                      <span style={{ width: 26, display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name={lingeIconOf(l)} size={18} color="#1A1A1A" /></span>
                      <span style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 500, color: '#4D2528' }}>{l.name}</span>
                      <Icon name="plus" size={15} color="#9A9A9A" />
                    </button>)}
                </div>}
            </div>

            {/* Linges ajoutés */}
            {addedKeys.length === 0 ?
              <div style={{ fontSize: 12.5, color: '#7A6060', fontStyle: 'italic', padding: '12px 2px 0' }}>Ajoutez au moins un linge concerné par l'anomalie.</div> :
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {addedKeys.map((key) => {
                  const [sku, dpt] = key.split('__');
                  const l = lingeBySku(sku);
                  if (!l) return null;
                  const q = qtys[key] || 0;
                  return (
                    <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '8px 12px', borderRadius: 10, border: '1px solid #1A1A1A', background: '#FAFAFA' }}>
                      <span style={{ width: 24, display: 'grid', placeItems: 'center', flexShrink: 0 }}><Icon name={lingeIconOf(l)} size={18} color="#1A1A1A" /></span>
                      <span style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 500, color: '#4D2528' }}>{l.name}<span style={{ fontSize: 11, color: '#7A6060', fontWeight: 400 }}> · {(deptOf(dpt) || {}).label}</span></span>
                      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                        <button onClick={() => setQty(key, Math.max(1, q - 1))} style={anomStep}><Icon name="minus" size={13} color="#1A1A1A" /></button>
                        <span style={{ minWidth: 30, textAlign: 'center', fontWeight: 800, fontSize: 15, color: '#4D2528' }}>{q}</span>
                        <button onClick={() => setQty(key, q + 1)} style={anomStep}><Icon name="plus" size={13} color="#1A1A1A" /></button>
                      </div>
                      <button onClick={() => removeLinen(key)} title="Retirer" style={{ width: 28, height: 28, borderRadius: 7, border: '1px solid #E5E5E5', background: '#FFFFFF', cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0, flexShrink: 0 }}><Icon name="trash" size={13} color="#B91C1C" /></button>
                    </div>);
                })}
              </div>}

            {totalPieces > 0 &&
            <div style={{ marginTop: 14, padding: '10px 14px', background: '#4D2528', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 12.5, color: '#B0B0B0' }}>Total à décrémenter du stock</span>
                <span style={{ fontSize: 15, fontWeight: 800, color: '#FFFFFF' }}>{totalPieces} pièce{totalPieces > 1 ? 's' : ''}</span>
              </div>}
          </section>

          {/* ── Commentaire ── */}
          <section>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: '#4D2528' }}>Commentaire</span>
              <span style={{ fontSize: 11, fontWeight: 500, color: '#7A6060' }}>Optionnel</span>
            </div>
            <textarea
              value={comment}
              onChange={(e) => setComment(e.target.value)}
              placeholder="Décrivez l'anomalie : taches, déchirures, mauvaise quantité, conditionnement endommagé…"
              rows={3}
              style={{
                width: '100%', padding: '12px 14px', fontFamily: 'inherit',
                fontSize: 14, color: '#4D2528', lineHeight: 1.55,
                background: '#FAFAFA', border: '1px solid #E5E5E5', borderRadius: 10,
                resize: 'vertical', boxSizing: 'border-box', outline: 'none'
              }} />
          </section>
        </div>

        {/* Pied de modale */}
        <div style={{ padding: '16px 24px', borderTop: '1px solid #F0F0F0', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
          {!canSubmit &&
          <span style={{ fontSize: 12, color: '#7A6060', flex: 1 }}>
              {photos.length === 0 ? 'Au moins 1 photo est requise.' : 'Sélectionnez au moins un linge concerné.'}
            </span>
          }
          <div style={{ flex: 1 }} />
          <button onClick={onClose} style={{ padding: '10px 18px', borderRadius: 10, background: 'transparent', border: '1px solid #D4D4D4', color: '#5E4040', fontFamily: 'inherit', fontSize: 14, cursor: 'pointer', fontWeight: 500 }}>
            Annuler
          </button>
          <button
            onClick={canSubmit ? handleSubmit : undefined}
            disabled={!canSubmit}
            style={{
              padding: '10px 22px', borderRadius: 10, border: 0,
              background: canSubmit ? '#4D2528' : '#F0F0F0',
              color: canSubmit ? '#FFFFFF' : '#7A6060',
              fontFamily: 'inherit', fontSize: 14, fontWeight: 700,
              cursor: canSubmit ? 'pointer' : 'not-allowed',
              display: 'inline-flex', alignItems: 'center', gap: 8
            }}>
            <AlertTriangleIcon size={15} color={canSubmit ? '#FFFFFF' : '#7A6060'} />
            Déclarer l'anomalie
          </button>
        </div>
      </div>


    </div>);

}

const overlayStyle = {
  position: 'fixed', inset: 0,
  background: 'rgba(10,10,10,0.60)',
  zIndex: 1000,
  display: 'flex', alignItems: 'center', justifyContent: 'center',
  padding: 24
};

Object.assign(window, { AnomalieFloatingBtn, AnomalieModal });

// ======================================================
// 13. APP ROOT COMPONENT
// ======================================================
function AppV7UI() {
  const ROUTE_KEY = 'linge-v7ui-route';
  const VALIDATED_KEY = 'linge-v7ui-validated';
  const [route, setRoute] = React.useState(() => {
    try { return localStorage.getItem(ROUTE_KEY) || 'accueil'; } catch(e) { return 'accueil'; }
  });
  const [validatedReceptions, setValidatedReceptions] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(VALIDATED_KEY) || '{}'); } catch(e) { return {}; }
  });
  const [showAnomalie, setShowAnomalie] = React.useState(false);
  const goto = (r) => { setRoute(r); try { localStorage.setItem(ROUTE_KEY, r); } catch(e) {} };
  const onValidateReception = (id, result) => {
    const next = { ...validatedReceptions, [id]: result };
    setValidatedReceptions(next);
    try { localStorage.setItem(VALIDATED_KEY, JSON.stringify(next)); } catch(e) {}
  };
  const onResetReceptions = () => {
    setValidatedReceptions({});
    try { localStorage.removeItem(VALIDATED_KEY); } catch(e) {}
  };
  const pending = typeof pendingReceptionsCount !== 'undefined' ? pendingReceptionsCount(Object.keys(validatedReceptions)) : 0;
  const onAnomalie = () => setShowAnomalie(true);
  const parts = route.split('/');
  let view;
  if (parts[0] === 'commande') {
    view = <CommandeDetailV7 id={parts[1]} goto={goto} pendingReceptions={pending} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'reception' && parts[1]) {
    view = <ReceptionDetailV7 id={parts[1]} goto={goto} pendingReceptions={pending} validatedReceptions={validatedReceptions} onValidateReception={onValidateReception} initialDiff={parts[2]==='diff'} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'nouvelle-commande') {
    view = <NouvelleCommandeV7 goto={goto} pendingReceptions={pending} onAnomalie={onAnomalie} />;
  } else if (parts[0] === 'parametrage') {
    view = <ShellV7 active={route} onNavigate={goto} pendingReceptions={pending} onAnomalie={onAnomalie} kicker="Paramétrage" title="Paramètres établissement"><div style={{padding:'40px',textAlign:'center',color:'#7A6060',fontSize:14}}>Cette section est en cours de développement.</div></ShellV7>;
  } else if (parts[0] === 'linge') {
    const tab = parts[1] || 'commandes';
    view = <LingeV7 goto={goto} tab={tab} pendingReceptions={pending} validatedReceptions={validatedReceptions} onValidateReception={onValidateReception} onResetReceptions={onResetReceptions} onAnomalie={onAnomalie} />;
  } else {
    view = <AccueilDashboard goto={goto} pendingReceptions={pending} onAnomalie={onAnomalie} />;
  }
  return (<>{view}{showAnomalie && <AnomalieModal onClose={() => setShowAnomalie(false)} />}</>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppV7UI />);
  </script>
</body>
